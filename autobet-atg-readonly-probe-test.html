<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>芯瑤 ATG Read-Only Probe 測試</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:30px 16px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif;
  background:#fff6fa;
  color:#59434d;
}

.wrap{
  width:min(860px,100%);
  margin:auto;
}

.card{
  background:#fff;
  border:1px solid #ffd3e3;
  border-radius:20px;
  padding:20px;
  margin-bottom:16px;
}

h1{
  margin-top:0;
  color:#ef377e;
}

.notice{
  padding:12px;
  border-radius:12px;
  background:#fff0f6;
  line-height:1.7;
}

.ok{
  color:#16865b;
  font-weight:900;
  line-height:1.9;
}

.fail{
  color:#d83d58;
  font-weight:900;
  line-height:1.9;
}

#fake-atg{
  display:none;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="card">
    <h1>🌸 芯瑤 ATG Read-Only Probe 測試</h1>

    <div class="notice">
      ⚠️ 測試診斷器能不能找出「候選資料」。<br>
      不按 Spin、不改注、不寫入 ATG，也不修改舊程式。
    </div>
  </div>

  <div class="card">
    <h3>🧪 Probe 測試</h3>
    <div id="result">測試中…</div>
  </div>

</div>

<div id="fake-atg">

  <div>
    目前餘額：
    <span>1,000.90</span>
  </div>

  <div>
    目前下注：
    <span>4</span>
  </div>

  <button
    data-room-id="0863"
  >
    房號 0863
  </button>

  <div>
    免費遊戲：否
  </div>

</div>

<script src="./xinyao_ATG_readonly_probe.js"></script>

<script>
(() => {

  const box =
    document.getElementById('result');

  if (!window.XinyaoATGReadOnlyProbe) {

    box.innerHTML =
      '<div class="fail">❌ Read-Only Probe 尚未建立｜這次失敗是正常的</div>';

    return;
  }

  const Probe =
    window.XinyaoATGReadOnlyProbe;

  const result =
    Probe.scan(
      document.getElementById('fake-atg')
    );

  const tests = [];

  function add(
    name,
    expected,
    actual
  ) {

    tests.push({
      name,
      expected:String(expected),
      actual:String(actual),
      ok:String(expected) === String(actual)
    });

  }

  add(
    '診斷模式',
    'PASSIVE_DIAGNOSTIC',
    result.mode
  );

  add(
    '找到餘額候選',
    true,
    result.balanceCandidates.includes('1,000.90')
  );

  add(
    '找到下注候選',
    true,
    result.betCandidates.includes('4')
  );

  add(
    '找到房號候選',
    true,
    result.roomCandidates.includes('0863')
  );

  add(
    '沒有 Spin 方法',
    'undefined',
    typeof Probe.spin
  );

  add(
    '沒有改注方法',
    'undefined',
    typeof Probe.setBet
  );

  let passed = 0;

  const html =
    tests.map(test => {

      if (test.ok) {
        passed++;
      }

      return `
        <div class="${test.ok ? 'ok' : 'fail'}">
          ${test.ok ? '✅' : '❌'}
          ${test.name}
          ｜預期：${test.expected}
          ｜實際：${test.actual}
        </div>
      `;

    }).join('');

  box.innerHTML =
    html +
    `<hr><b>結果：${passed} / ${tests.length} 通過</b>`;

})();
</script>

</body>
</html>
