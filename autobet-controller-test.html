<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>芯瑤 AutoBet 控制器測試</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:30px 16px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif;
  background:#fff6fa;
  color:#59434d;
}

.wrap{
  width:min(760px,100%);
  margin:auto;
}

.card{
  background:#fff;
  border:1px solid #ffd3e3;
  border-radius:20px;
  padding:20px;
  margin-bottom:16px;
}

h1{
  margin-top:0;
  color:#ef377e;
}

.notice{
  padding:12px;
  border-radius:12px;
  background:#fff0f6;
  line-height:1.7;
}

.ok{
  color:#16865b;
  font-weight:900;
  line-height:1.9;
}

.fail{
  color:#d83d58;
  font-weight:900;
  line-height:1.9;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="card">

    <h1>🌸 芯瑤 AutoBet 控制器測試</h1>

    <div class="notice">
      ⚠️ 目前只測試控制流程。<br>
      不會按 Spin、不會改下注金額、不會操作 ATG。
    </div>

  </div>

  <div class="card">

    <h3>🧪 Controller 測試</h3>

    <div id="result">
      測試中…
    </div>

  </div>

</div>

<script src="./xinyao_ATG_autobet_engine.js"></script>
<script src="./xinyao_ATG_autobet_strategy.js"></script>
<script src="./xinyao_ATG_autobet_controller.js"></script>

<script>
(() => {

  const box =
    document.getElementById('result');

  if (!window.XinyaoAutoBetController) {

    box.innerHTML =
      '<div class="fail">❌ Controller 尚未建立｜這次失敗是正常的</div>';

    return;
  }

  const settings = {
    takeProfit: 1000,
    stopLoss: 800,
    maxSpins: 100
  };

  const tests = [

    {
      name: '正常第一階段',
      state: {
        startBalance: 2000,
        balance: 2000,
        spins: 0,
        stage: 1
      },
      expectedAction: 'CONTINUE',
      expectedBet: 4,
      expectedSpins: 50
    },

    {
      name: '小贏進第二階段',
      state: {
        startBalance: 2000,
        balance: 2300,
        spins: 50,
        stage: 2
      },
      expectedAction: 'CONTINUE',
      expectedBet: 6,
      expectedSpins: 40
    },

    {
      name: '達到止盈立即停止',
      state: {
        startBalance: 2000,
        balance: 3000,
        spins: 35,
        stage: 2
      },
      expectedAction: 'STOP'
    },

    {
      name: '達到止損立即停止',
      state: {
        startBalance: 2000,
        balance: 1200,
        spins: 35,
        stage: 2
      },
      expectedAction: 'STOP'
    },

    {
      name: '免遊期間暫停',
      state: {
        startBalance: 2000,
        balance: 2200,
        spins: 30,
        stage: 2,
        freeGameActive: true
      },
      expectedAction: 'PAUSE'
    }

  ];

  let passed = 0;

  const html =
    tests.map(test => {

      const actual =
        window.XinyaoAutoBetController.decide(
          test.state,
          settings
        );

      let ok =
        actual.action === test.expectedAction;

      if (
        test.expectedAction === 'CONTINUE'
      ) {
        ok =
          ok &&
          Number(actual.bet) === test.expectedBet &&
          Number(actual.stageSpins) === test.expectedSpins;
      }

      if (ok) {
        passed++;
      }

      const detail =
        actual.action === 'CONTINUE'
          ? `${actual.bet} 元 × ${actual.stageSpins} 轉`
          : actual.reason;

      return `
        <div class="${ok ? 'ok' : 'fail'}">
          ${ok ? '✅' : '❌'}
          ${test.name}
          ｜${actual.action}
          ｜${detail}
        </div>
      `;

    }).join('');

  box.innerHTML =
    html +
    `<hr><b>結果：${passed} / ${tests.length} 通過</b>`;

})();
</script>

</body>
</html>
