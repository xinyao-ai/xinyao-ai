<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>芯瑤 ATG Session Sync 測試</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:30px 16px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif;
  background:#fff6fa;
  color:#59434d;
}

.wrap{
  width:min(820px,100%);
  margin:auto;
}

.card{
  background:#fff;
  border:1px solid #ffd3e3;
  border-radius:20px;
  padding:20px;
  margin-bottom:16px;
}

h1{
  margin-top:0;
  color:#ef377e;
}

.notice{
  padding:12px;
  border-radius:12px;
  background:#fff0f6;
  line-height:1.7;
}

.ok{
  color:#16865b;
  font-weight:900;
  line-height:1.9;
}

.fail{
  color:#d83d58;
  font-weight:900;
  line-height:1.9;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="card">

    <h1>🌸 芯瑤 ATG Session Sync 測試</h1>

    <div class="notice">
      ⚠️ 測試 Read Pipeline → Session。<br>
      只同步點數、免遊、一局完成與唯讀資料，不會操作真正 ATG。
    </div>

  </div>

  <div class="card">

    <h3>🧪 Session Sync 測試</h3>

    <div id="result">
      測試中…
    </div>

  </div>

</div>

<script src="./xinyao_ATG_autobet_engine.js"></script>
<script src="./xinyao_ATG_autobet_strategy.js"></script>
<script src="./xinyao_ATG_autobet_controller.js"></script>
<script src="./xinyao_ATG_autobet_runner.js"></script>
<script src="./xinyao_ATG_autobet_session.js"></script>

<script src="./xinyao_ATG_autobet_atg_source_bridge.js"></script>
<script src="./xinyao_ATG_autobet_atg_adapter.js"></script>
<script src="./xinyao_ATG_autobet_atg_read_pipeline.js"></script>

<script src="./xinyao_ATG_autobet_atg_session_sync.js"></script>

<script>
(() => {

  const box =
    document.getElementById('result');

  if (!window.XinyaoATGReadSessionSync) {

    box.innerHTML =
      '<div class="fail">❌ Session Sync 尚未建立｜這次失敗是正常的</div>';

    return;
  }

  const B =
    window.XinyaoATGSourceBridge;

  const P =
    window.XinyaoATGReadPipeline;

  const S =
    window.XinyaoAutoBetSession;

  const Y =
    window.XinyaoATGReadSessionSync;

  let source = {
    balance: '1000.90',
    bet: '4',
    roomId: '0863',
    freeGameActive: false,
    spinCompleted: false
  };

  B.configure({
    sourceReader: () => source
  });

  P.connect();

  S.reset({
    startBalance: 1000.90,
    balance: 1000.90,
    takeProfit: 500,
    stopLoss: 400,
    maxSpins: 100
  });

  Y.reset();
  Y.connect();

  const tests = [];

  function add(
    name,
    expected,
    actual
  ) {

    tests.push({
      name,
      expected:String(expected),
      actual:String(actual),
      ok:String(expected) === String(actual)
    });

  }

  /*
    第一次同步：
    還沒有完成一局。
  */
  Y.syncOnce();

  add(
    '初始點數同步',
    1000.9,
    S.getState().balance
  );

  add(
    '尚未增加轉數',
    0,
    S.getState().totalSpins
  );

  add(
    '目前下注唯讀資料',
    4,
    Y.getLastRead().bet
  );

  add(
    '目前房號唯讀資料',
    '0863',
    Y.getLastRead().roomId
  );

  /*
    模擬第一局完成。
  */
  source = {
    balance: '996.90',
    bet: '4',
    roomId: '0863',
    freeGameActive: false,
    spinCompleted: true
  };

  Y.syncOnce();

  add(
    '第一局完成後點數',
    996.9,
    S.getState().balance
  );

  add(
    '第一局只增加一次',
    1,
    S.getState().totalSpins
  );

  /*
    spinCompleted 還維持 true。
    再同步一次不能重複算第二局。
  */
  Y.syncOnce();

  add(
    '完成訊號持續 true 不重複計算',
    1,
    S.getState().totalSpins
  );

  /*
    先回 false，再進入下一個 true，
    才算下一局完成。
  */
  source = {
    balance: '996.90',
    bet: '4',
    roomId: '0863',
    freeGameActive: false,
    spinCompleted: false
  };

  Y.syncOnce();

  source = {
    balance: '992.90',
    bet: '4',
    roomId: '0863',
    freeGameActive: false,
    spinCompleted: true
  };

  Y.syncOnce();

  add(
    '第二個完成訊號才算第二局',
    2,
    S.getState().totalSpins
  );

  add(
    '第二局點數',
    992.9,
    S.getState().balance
  );

  let passed = 0;

  const html =
    tests.map(test => {

      if (test.ok) {
        passed++;
      }

      return `
        <div class="${test.ok ? 'ok' : 'fail'}">
          ${test.ok ? '✅' : '❌'}
          ${test.name}
          ｜預期：${test.expected}
          ｜實際：${test.actual}
        </div>
      `;

    }).join('');

  box.innerHTML =
    html +
    `<hr><b>結果：${passed} / ${tests.length} 通過</b>`;

})();
</script>

</body>
</html>
