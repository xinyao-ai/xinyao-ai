<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>芯瑤 ATG Read-Only Adapter 測試</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:30px 16px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif;
  background:#fff6fa;
  color:#59434d;
}

.wrap{
  width:min(820px,100%);
  margin:auto;
}

.card{
  background:#fff;
  border:1px solid #ffd3e3;
  border-radius:20px;
  padding:20px;
  margin-bottom:16px;
}

h1{
  margin-top:0;
  color:#ef377e;
}

.notice{
  padding:12px;
  border-radius:12px;
  background:#fff0f6;
  line-height:1.7;
}

.ok{
  color:#16865b;
  font-weight:900;
  line-height:1.9;
}

.fail{
  color:#d83d58;
  font-weight:900;
  line-height:1.9;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="card">
    <h1>🌸 芯瑤 ATG Read-Only Adapter 測試</h1>

    <div class="notice">
      ⚠️ 這一步只測試「讀取 ATG 資料的格式」。<br>
      使用假資料，不會連真正 ATG、不會按 Spin、不會改下注。
    </div>
  </div>

  <div class="card">
    <h3>🧪 Adapter 測試</h3>
    <div id="result">測試中…</div>
  </div>

</div>

<script src="./xinyao_ATG_autobet_atg_adapter.js"></script>

<script>
(() => {

  const box =
    document.getElementById('result');

  if (!window.XinyaoATGReadOnlyAdapter) {

    box.innerHTML =
      '<div class="fail">❌ ATG Adapter 尚未建立｜這次失敗是正常的</div>';

    return;
  }

  const A =
    window.XinyaoATGReadOnlyAdapter;

  /*
    假裝這些資料是從 ATG 讀到的。
    目前完全不碰真正遊戲。
  */
  A.configure({
    reader: () => ({
      balance: '1000.90',
      bet: '4',
      roomId: '0863',
      freeGameActive: false,
      spinCompleted: true
    })
  });

  const data =
    A.read();

  const tests = [];

  function add(
    name,
    expected,
    actual
  ) {

    tests.push({
      name,
      expected:String(expected),
      actual:String(actual),
      ok:String(expected) === String(actual)
    });

  }

  add(
    '目前點數',
    1000.90,
    data.balance
  );

  add(
    '目前下注',
    4,
    data.bet
  );

  add(
    '目前房號保留前導 0',
    '0863',
    data.roomId
  );

  add(
    '目前不是免遊',
    false,
    data.freeGameActive
  );

  add(
    '一局已完成',
    true,
    data.spinCompleted
  );

  add(
    'Adapter 模式',
    'READ_ONLY',
    data.mode
  );

  let passed = 0;

  const html =
    tests.map(test => {

      if (test.ok) {
        passed++;
      }

      return `
        <div class="${test.ok ? 'ok' : 'fail'}">

          ${test.ok ? '✅' : '❌'}

          ${test.name}

          ｜預期：
          ${test.expected}

          ｜實際：
          ${test.actual}

        </div>
      `;

    }).join('');

  box.innerHTML =
    html +
    `<hr><b>結果：${passed} / ${tests.length} 通過</b>`;

})();
</script>

</body>
</html>
