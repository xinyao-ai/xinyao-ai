<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>芯瑤 AutoBet Session 測試</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:30px 16px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif;
  background:#fff6fa;
  color:#59434d;
}
.wrap{width:min(800px,100%);margin:auto}
.card{
  background:#fff;
  border:1px solid #ffd3e3;
  border-radius:20px;
  padding:20px;
  margin-bottom:16px;
}
h1{margin-top:0;color:#ef377e}
.notice{
  padding:12px;
  border-radius:12px;
  background:#fff0f6;
  line-height:1.7;
}
.ok{color:#16865b;font-weight:900;line-height:1.9}
.fail{color:#d83d58;font-weight:900;line-height:1.9}
</style>
</head>

<body>

<div class="wrap">

  <div class="card">
    <h1>🌸 芯瑤 AutoBet Session 測試</h1>

    <div class="notice">
      ⚠️ 目前只測試 AutoBet 資料狀態。<br>
      不會按 Spin、不會改注、不會連接正式 ATG。
    </div>
  </div>

  <div class="card">
    <h3>🧪 Session 測試</h3>
    <div id="result">測試中…</div>
  </div>

</div>

<script src="./xinyao_ATG_autobet_engine.js"></script>
<script src="./xinyao_ATG_autobet_strategy.js"></script>
<script src="./xinyao_ATG_autobet_controller.js"></script>
<script src="./xinyao_ATG_autobet_runner.js"></script>
<script src="./xinyao_ATG_autobet_session.js"></script>

<script>
(() => {

  const box = document.getElementById('result');

  if (!window.XinyaoAutoBetSession) {
    box.innerHTML =
      '<div class="fail">❌ Session 尚未建立｜這次失敗是正常的</div>';
    return;
  }

  const S = window.XinyaoAutoBetSession;

  const tests = [];

  function test(name, expected, actual) {
    tests.push({
      name,
      expected,
      actual,
      ok: String(expected) === String(actual)
    });
  }

  S.reset({
    startBalance: 2000,
    balance: 2000,
    takeProfit: 1000,
    stopLoss: 800,
    maxSpins: 100
  });

  let state = S.getState();

  test(
    '進房本金',
    2000,
    state.startBalance
  );

  test(
    '目前點數',
    2000,
    state.balance
  );

  test(
    '初始盈虧',
    0,
    state.profit
  );

  S.updateBalance(1850);

  state = S.getState();

  test(
    '點數更新',
    1850,
    state.balance
  );

  test(
    '虧損計算',
    -150,
    state.profit
  );

  S.recordSpin({
    balance: 1846,
    freeGameActive: false
  });

  state = S.getState();

  test(
    '完成轉數 +1',
    1,
    state.totalSpins
  );

  test(
    '階段轉數 +1',
    1,
    state.stageCompletedSpins
  );

  const decision = S.getDecision();

  test(
    '第一階段建議注額',
    4,
    decision.bet
  );

  test(
    '剩餘轉數',
    49,
    decision.remainingStageSpins
  );

  S.setFreeGame(true);

  const freeDecision = S.getDecision();

  test(
    '免遊時暫停',
    'PAUSE',
    freeDecision.action
  );

  let passed = 0;

  const html = tests.map(t => {

    if (t.ok) passed++;

    return `
      <div class="${t.ok ? 'ok' : 'fail'}">
        ${t.ok ? '✅' : '❌'}
        ${t.name}
        ｜預期：${t.expected}
        ｜實際：${t.actual}
      </div>
    `;

  }).join('');

  box.innerHTML =
    html +
    `<hr><b>結果：${passed} / ${tests.length} 通過</b>`;

})();
</script>

</body>
</html>
