<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>芯瑤 ATG Component Runtime Probe 測試</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:30px 16px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif;
  background:#fff6fa;
  color:#59434d;
}

.wrap{
  width:min(900px,100%);
  margin:auto;
}

.card{
  background:#fff;
  border:1px solid #ffd3e3;
  border-radius:20px;
  padding:20px;
  margin-bottom:16px;
}

h1{
  margin-top:0;
  color:#ef377e;
}

.notice{
  padding:12px;
  border-radius:12px;
  background:#fff0f6;
  line-height:1.7;
}

.ok{
  color:#16865b;
  font-weight:900;
  line-height:1.9;
}

.fail{
  color:#d83d58;
  font-weight:900;
  line-height:1.9;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="card">

    <h1>
      🌸 芯瑤 ATG Component Runtime Probe 測試
    </h1>

    <div class="notice">
      ⚠️ 目前只測 ComponentScheduler 的更新流程。<br>
      不修改 dt、不加速、不按 Spin、不改下注。
    </div>

  </div>

  <div class="card">

    <h3>🧪 Component Runtime Probe 測試</h3>

    <div id="result">
      測試中…
    </div>

  </div>

</div>


<script src="./xinyao_ATG_component_runtime_probe.js"></script>

<script>
(() => {

  const box =
    document.getElementById('result');


  /*
    RED：
    Probe 還沒建立時，
    這個失敗就是正常的。
  */
  if (
    !window.XinyaoATGComponentRuntimeProbe
  ) {

    box.innerHTML =
      '<div class="fail">❌ Component Runtime Probe 尚未建立｜這次失敗是正常的</div>';

    return;
  }


  const Probe =
    window.XinyaoATGComponentRuntimeProbe;


  /* ======================================================
     Fake Cocos ComponentScheduler
  ====================================================== */

  const calls = [];


  const originalStartPhase =
    function() {

      calls.push(
        ['start']
      );

      return 'start-return';
    };


  const originalUpdatePhase =
    function(dt) {

      calls.push(
        ['update', dt]
      );

      return 'update-return';
    };


  const originalLateUpdatePhase =
    function(dt) {

      calls.push(
        ['late', dt]
      );

      return 'late-return';
    };


  const fakeCompScheduler = {

    startPhase:
      originalStartPhase,

    updatePhase:
      originalUpdatePhase,

    lateUpdatePhase:
      originalLateUpdatePhase
  };


  const fakeDirector = {

    _compScheduler:
      fakeCompScheduler
  };


  const fakeCC = {

    director:
      fakeDirector
  };


  const fakeGlobals = {

    cc:
      fakeCC
  };


  /* ======================================================
     安裝
  ====================================================== */

  Probe.reset();

  Probe.install({
    globals:
      fakeGlobals
  });


  const tests = [];


  function add(
    name,
    expected,
    actual
  ) {

    tests.push({

      name,

      expected:
        String(expected),

      actual:
        String(actual),

      ok:
        String(expected) ===
        String(actual)
    });
  }


  /* ======================================================
     Runtime
  ====================================================== */

  add(
    '安裝狀態',
    true,
    Probe.getState().installed
  );


  add(
    '找到 Director',
    true,
    Probe.getState().hasDirector
  );


  add(
    '找到 ComponentScheduler',
    true,
    Probe.getState().hasComponentScheduler
  );


  add(
    '找到 startPhase',
    true,
    Probe.getState().hasStartPhase
  );


  add(
    '找到 updatePhase',
    true,
    Probe.getState().hasUpdatePhase
  );


  add(
    '找到 lateUpdatePhase',
    true,
    Probe.getState().hasLateUpdatePhase
  );


  /* ======================================================
     startPhase
  ====================================================== */

  const startReturn =
    fakeCompScheduler.startPhase();


  add(
    'startPhase 次數',
    1,
    Probe.snapshot().start.count
  );


  add(
    'startPhase 回傳值沒被破壞',
    'start-return',
    startReturn
  );


  /* ======================================================
     updatePhase
  ====================================================== */

  const updateReturn =
    fakeCompScheduler.updatePhase(
      0.0167
    );


  fakeCompScheduler.updatePhase(
    0.0333
  );


  let snap =
    Probe.snapshot();


  add(
    'updatePhase 次數',
    2,
    snap.update.count
  );


  add(
    'updatePhase 最後 dt',
    0.0333,
    snap.update.lastDt
  );


  add(
    'updatePhase 最大 dt',
    0.0333,
    snap.update.maxDt
  );


  add(
    'updatePhase 回傳值沒被破壞',
    'update-return',
    updateReturn
  );


  /* ======================================================
     lateUpdatePhase
  ====================================================== */

  const lateReturn =
    fakeCompScheduler.lateUpdatePhase(
      0.0167
    );


  fakeCompScheduler.lateUpdatePhase(
    0.0500
  );


  snap =
    Probe.snapshot();


  add(
    'lateUpdatePhase 次數',
    2,
    snap.late.count
  );


  add(
    'lateUpdatePhase 最後 dt',
    0.05,
    snap.late.lastDt
  );


  add(
    'lateUpdatePhase 最大 dt',
    0.05,
    snap.late.maxDt
  );


  add(
    'lateUpdatePhase 回傳值沒被破壞',
    'late-return',
    lateReturn
  );


  /* ======================================================
     安全條件
  ====================================================== */

  add(
    'Probe 模式',
    'PASSIVE_COMPONENT_RUNTIME_PROBE',
    Probe.getMode()
  );


  add(
    '沒有 setSpeed',
    'undefined',
    typeof Probe.setSpeed
  );


  add(
    '沒有 Spin',
    'undefined',
    typeof Probe.spin
  );


  add(
    '沒有下注控制',
    'undefined',
    typeof Probe.setBet
  );


  /* ======================================================
     卸載
  ====================================================== */

  Probe.uninstall();


  add(
    '卸載狀態',
    false,
    Probe.getState().installed
  );


  add(
    'startPhase 已恢復',
    true,
    fakeCompScheduler.startPhase ===
      originalStartPhase
  );


  add(
    'updatePhase 已恢復',
    true,
    fakeCompScheduler.updatePhase ===
      originalUpdatePhase
  );


  add(
    'lateUpdatePhase 已恢復',
    true,
    fakeCompScheduler.lateUpdatePhase ===
      originalLateUpdatePhase
  );


  /* ======================================================
     輸出
  ====================================================== */

  let passed = 0;


  const html =
    tests.map(test => {

      if (test.ok) {
        passed++;
      }

      return `
        <div class="${
          test.ok
            ? 'ok'
            : 'fail'
        }">

          ${
            test.ok
              ? '✅'
              : '❌'
          }

          ${test.name}

          ｜預期：
          ${test.expected}

          ｜實際：
          ${test.actual}

        </div>
      `;

    }).join('');


  box.innerHTML =
    html +
    `<hr><b>結果：${passed} / ${tests.length} 通過</b>`;

})();
</script>

</body>
</html>
