<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>正在切換 ATG 遊戲</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    html,body{margin:0;min-height:100%;background:#0d0910;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC",sans-serif}
    body{min-height:100vh;display:grid;place-items:center}
    .box{width:min(360px,calc(100vw - 36px));padding:22px;border:1px solid rgba(255,142,191,.35);border-radius:20px;background:#1d1621;text-align:center;box-shadow:0 18px 60px rgba(0,0,0,.42)}
    .title{font-size:17px;font-weight:900;color:#ff9bc3}.sub{margin-top:9px;font-size:12px;line-height:1.7;opacity:.75}
  </style>
</head>
<body>
  <div class="box">
    <div class="title">🌸 芯瑤 ATG</div>
    <div class="sub" id="msg">正在切換遊戲…</div>
  </div>
<script>
(() => {
  const routes = {
    seth: 'https://hd5577.com/GameLobby?g=ATG&c=golden-seth',
    tiger: 'https://hd5577.com/GameLobby?g=ATG&c=tiger-princess&p=web&l=zh-cn',
    seth1: 'https://hd5577.com/GameLobby?g=ATG&c=egyptian-mythology',
    baphomet: 'https://hd5577.com/GameLobby?g=ATG&c=hades',
    vampire: 'https://hd5577.com/GameLobby?g=ATG&c=new-vampire-hunter',
    wuxia: 'https://hd5577.com/GameLobby?g=ATG&c=wuxia-caishen'
  };

  const q = new URLSearchParams(location.search);
  const game = String(q.get('game') || '').toLowerCase();
  const marker = String(q.get('marker') || '');
  const validMarker = /^xinyao-hd-launch:(seth|tiger|seth1|baphomet|vampire|wuxia):\d+:[a-z0-9]+$/i.test(marker);

  if (!routes[game] || !validMarker || !marker.toLowerCase().includes(':' + game + ':')) {
    document.getElementById('msg').textContent = '遊戲入口資料無效，請回會員頁重新點選。';
    return;
  }

  try { window.name = marker; } catch (_) {}
  location.replace(routes[game]);
})();
</script>
</body>
</html>
