<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>芯瑤 ATG QuickStop Probe 測試</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:30px 16px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif;
  background:#fff6fa;
  color:#59434d;
}

.wrap{
  width:min(900px,100%);
  margin:auto;
}

.card{
  background:#fff;
  border:1px solid #ffd3e3;
  border-radius:20px;
  padding:20px;
  margin-bottom:16px;
}

h1{
  margin-top:0;
  color:#ef377e;
}

.notice{
  padding:12px;
  border-radius:12px;
  background:#fff0f6;
  line-height:1.7;
}

.ok{
  color:#16865b;
  font-weight:900;
  line-height:1.9;
}

.fail{
  color:#d83d58;
  font-weight:900;
  line-height:1.9;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="card">

    <h1>
      🌸 芯瑤 ATG QuickStop Probe 測試
    </h1>

    <div class="notice">
      ⚠️ 只測 SpinButton / QuickStopBtn 的結構與方法名稱。<br>
      不執行方法、不按 QuickStop、不 Spin、不改下注。
    </div>

  </div>

  <div class="card">

    <h3>🧪 QuickStop Probe 測試</h3>

    <div id="result">
      測試中…
    </div>

  </div>

</div>


<script src="./xinyao_ATG_quickstop_probe.js"></script>

<script>
(() => {

  const box =
    document.getElementById('result');


  /* ======================================================
     RED
  ====================================================== */

  if (
    !window.XinyaoATGQuickStopProbe
  ) {

    box.innerHTML =
      '<div class="fail">❌ QuickStop Probe 尚未建立｜這次失敗是正常的</div>';

    return;
  }


  const Probe =
    window.XinyaoATGQuickStopProbe;


  let dangerousCalls =
    0;


  /* ======================================================
     Fake SpinButton
  ====================================================== */

  class FakeSpinButton {

    constructor() {

      this.__classname__ =
        'SpinButton';

      this.node = {
        name:'QuickStopBtn'
      };

      this.enabled =
        true;

      this.interactable =
        true;
    }


    onQuickStop() {

      dangerousCalls++;

      return 'quick-stop';
    }


    stopReel() {

      dangerousCalls++;

      return 'stop-reel';
    }


    onClick() {

      dangerousCalls++;

      return 'click';
    }


    update(dt) {

      return dt;
    }
  }


  const spinButton =
    new FakeSpinButton();


  spinButton.customMethod =
    function() {

      dangerousCalls++;

      return 'custom';
    };


  spinButton._privateFlag =
    true;


  /* ======================================================
     其他 Component
  ====================================================== */

  const otherComponent = {

    __classname__:
      'UILabel',

    node:{
      name:'label'
    },

    update(){}

  };


  /* ======================================================
     模擬 Probe 可取得的 Component 清單
  ====================================================== */

  const fakeComponents = [

    otherComponent,

    spinButton

  ];


  /* ======================================================
     Inspect
  ====================================================== */

  Probe.reset();


  const result =
    Probe.inspect({

      components:
        fakeComponents,

      componentName:
        'SpinButton',

      nodeName:
        'QuickStopBtn'

    });


  const tests =
    [];


  function add(
    name,
    expected,
    actual
  ) {

    tests.push({

      name,

      expected:
        String(expected),

      actual:
        String(actual),

      ok:
        String(expected) ===
        String(actual)

    });
  }


  /* ======================================================
     Target
  ====================================================== */

  add(
    '有找到目標',
    true,
    result.found
  );


  add(
    'Component 名稱',
    'SpinButton',
    result.componentName
  );


  add(
    'Node 名稱',
    'QuickStopBtn',
    result.nodeName
  );


  /* ======================================================
     Instance Properties
  ====================================================== */

  add(
    '讀到 enabled',
    true,
    result.properties.some(
      item =>
        item.name === 'enabled'
    )
  );


  add(
    '讀到 interactable',
    true,
    result.properties.some(
      item =>
        item.name === 'interactable'
    )
  );


  add(
    '讀到 customMethod',
    true,
    result.methods.some(
      item =>
        item.name === 'customMethod'
    )
  );


  /* ======================================================
     Prototype Methods
  ====================================================== */

  add(
    '找到 onQuickStop',
    true,
    result.methods.some(
      item =>
        item.name === 'onQuickStop'
    )
  );


  add(
    '找到 stopReel',
    true,
    result.methods.some(
      item =>
        item.name === 'stopReel'
    )
  );


  add(
    '找到 onClick',
    true,
    result.methods.some(
      item =>
        item.name === 'onClick'
    )
  );


  add(
    '找到 update',
    true,
    result.methods.some(
      item =>
        item.name === 'update'
    )
  );


  /* ======================================================
     關鍵字分類
  ====================================================== */

  add(
    'Quick 關鍵方法有找到',
    true,
    result.candidates.some(
      item =>
        item.name === 'onQuickStop'
    )
  );


  add(
    'Stop 關鍵方法有找到',
    true,
    result.candidates.some(
      item =>
        item.name === 'stopReel'
    )
  );


  /* ======================================================
     安全
  ====================================================== */

  add(
    '完全沒有執行任何方法',
    0,
    dangerousCalls
  );


  add(
    'Probe 模式',
    'PASSIVE_QUICKSTOP_PROBE',
    Probe.getMode()
  );


  add(
    '沒有 trigger',
    'undefined',
    typeof Probe.trigger
  );


  add(
    '沒有 quickStop',
    'undefined',
    typeof Probe.quickStop
  );


  add(
    '沒有 Spin',
    'undefined',
    typeof Probe.spin
  );


  add(
    '沒有下注功能',
    'undefined',
    typeof Probe.setBet
  );


  /* ======================================================
     Reset
  ====================================================== */

  Probe.reset();


  add(
    'Reset 後 found',
    false,
    Probe.getLastResult().found
  );


  /* ======================================================
     Output
  ====================================================== */

  let passed =
    0;


  const html =
    tests.map(test => {

      if (test.ok) {
        passed++;
      }


      return `
        <div class="${
          test.ok
            ? 'ok'
            : 'fail'
        }">

          ${
            test.ok
              ? '✅'
              : '❌'
          }

          ${test.name}

          ｜預期：
          ${test.expected}

          ｜實際：
          ${test.actual}

        </div>
      `;

    }).join('');


  box.innerHTML =
    html +
    `<hr><b>結果：${passed} / ${tests.length} 通過</b>`;

})();
</script>

</body>
</html>
