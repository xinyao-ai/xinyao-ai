<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>芯瑤 ATG Read Pipeline 測試</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:30px 16px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif;
  background:#fff6fa;
  color:#59434d;
}

.wrap{
  width:min(820px,100%);
  margin:auto;
}

.card{
  background:#fff;
  border:1px solid #ffd3e3;
  border-radius:20px;
  padding:20px;
  margin-bottom:16px;
}

h1{
  margin-top:0;
  color:#ef377e;
}

.notice{
  padding:12px;
  border-radius:12px;
  background:#fff0f6;
  line-height:1.7;
}

.ok{
  color:#16865b;
  font-weight:900;
  line-height:1.9;
}

.fail{
  color:#d83d58;
  font-weight:900;
  line-height:1.9;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="card">

    <h1>🌸 芯瑤 ATG Read Pipeline 測試</h1>

    <div class="notice">
      ⚠️ 測試 Source Bridge → Read-Only Adapter。<br>
      仍然使用假來源，不會操作真正 ATG。
    </div>

  </div>

  <div class="card">

    <h3>🧪 Pipeline 測試</h3>

    <div id="result">
      測試中…
    </div>

  </div>

</div>

<script src="./xinyao_ATG_autobet_atg_source_bridge.js"></script>
<script src="./xinyao_ATG_autobet_atg_adapter.js"></script>

<script src="./xinyao_ATG_autobet_atg_read_pipeline.js"></script>

<script>
(() => {

  const box =
    document.getElementById('result');

  if (!window.XinyaoATGReadPipeline) {

    box.innerHTML =
      '<div class="fail">❌ Read Pipeline 尚未建立｜這次失敗是正常的</div>';

    return;
  }

  const B =
    window.XinyaoATGSourceBridge;

  const P =
    window.XinyaoATGReadPipeline;

  B.configure({
    sourceReader: () => ({
      balance: '1,000.90',
      bet: '4',
      roomId: '0863',
      freeGameActive: false,
      spinCompleted: true
    })
  });

  P.connect();

  const data =
    P.read();

  const tests = [];

  function add(
    name,
    expected,
    actual
  ) {

    tests.push({
      name,
      expected:String(expected),
      actual:String(actual),
      ok:String(expected) === String(actual)
    });

  }

  add(
    '點數轉成數字',
    1000.9,
    data.balance
  );

  add(
    '下注轉成數字',
    4,
    data.bet
  );

  add(
    '房號保留前導 0',
    '0863',
    data.roomId
  );

  add(
    '免遊狀態',
    false,
    data.freeGameActive
  );

  add(
    '一局完成狀態',
    true,
    data.spinCompleted
  );

  add(
    '最終模式',
    'READ_ONLY',
    data.mode
  );

  add(
    'Pipeline 已連線',
    true,
    P.isConnected()
  );

  let passed = 0;

  const html =
    tests.map(test => {

      if (test.ok) {
        passed++;
      }

      return `
        <div class="${test.ok ? 'ok' : 'fail'}">
          ${test.ok ? '✅' : '❌'}
          ${test.name}
          ｜預期：${test.expected}
          ｜實際：${test.actual}
        </div>
      `;

    }).join('');

  box.innerHTML =
    html +
    `<hr><b>結果：${passed} / ${tests.length} 通過</b>`;

})();
</script>

</body>
</html>
