<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>芯瑤 AutoBet Live Panel 測試</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:30px 16px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif;
  background:#fff6fa;
  color:#59434d;
}

.wrap{
  width:min(860px,100%);
  margin:auto;
}

.card{
  background:#fff;
  border:1px solid #ffd3e3;
  border-radius:20px;
  padding:20px;
  margin-bottom:16px;
}

h1{
  margin-top:0;
  color:#ef377e;
}

.notice{
  padding:12px;
  border-radius:12px;
  background:#fff0f6;
  line-height:1.7;
}

.ok{
  color:#16865b;
  font-weight:900;
  line-height:1.9;
}

.fail{
  color:#d83d58;
  font-weight:900;
  line-height:1.9;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="card">
    <h1>🌸 芯瑤 AutoBet Live Panel 測試</h1>

    <div class="notice">
      ⚠️ 測試「假資料跑一局後，Panel 是否跟著更新」。<br>
      不會按真正 ATG Spin、不會改注。
    </div>
  </div>

  <div class="card">
    <h3>🧪 Live Panel 整合測試</h3>
    <div id="result">測試中…</div>
  </div>

  <div class="card">
    <h3>🎮 面板預覽</h3>
    <div id="xinyao-autobet-panel"></div>
  </div>

</div>

<script src="./xinyao_ATG_autobet_engine.js"></script>
<script src="./xinyao_ATG_autobet_strategy.js"></script>
<script src="./xinyao_ATG_autobet_controller.js"></script>
<script src="./xinyao_ATG_autobet_runner.js"></script>
<script src="./xinyao_ATG_autobet_console.js"></script>
<script src="./xinyao_ATG_autobet_session.js"></script>
<script src="./xinyao_ATG_autobet_simulator.js"></script>
<script src="./xinyao_ATG_autobet_live_sim.js"></script>
<script src="./xinyao_ATG_autobet_panel.js?v=0201"></script>

<script src="./xinyao_ATG_autobet_live_panel.js"></script>

<script>
(() => {

  const box =
    document.getElementById('result');

  if (!window.XinyaoAutoBetLivePanel) {

    box.innerHTML =
      '<div class="fail">❌ Live Panel 尚未建立｜這次失敗是正常的</div>';

    return;
  }

  const S =
    window.XinyaoAutoBetSession;

  const L =
    window.XinyaoAutoBetLiveSim;

  const LP =
    window.XinyaoAutoBetLivePanel;

  S.reset({
    startBalance: 2000,
    balance: 2000,
    takeProfit: 1000,
    stopLoss: 800,
    maxSpins: 100
  });

  L.reset();

  L.configure({
    balances: [
      1996,
      2004,
      1992
    ],
    intervalMs: 1000
  });

  LP.mount(
    '#xinyao-autobet-panel'
  );

  const tests = [];

  function text(id) {

    const el =
      document.getElementById(id);

    return el
      ? el.textContent.trim()
      : 'MISSING';
  }

  function add(
    name,
    expected,
    actual
  ) {

    tests.push({
      name,
      expected: String(expected),
      actual: String(actual),
      ok:
        String(expected) ===
        String(actual)
    });

  }

  add(
    '初始點數',
    '2000.00',
    text('xab-balance')
  );

  LP.start();

  add(
    '開始狀態',
    'RUNNING',
    L.getState().status
  );

  LP.tickOnce();

  add(
    '第 1 局點數更新',
    '1996.00',
    text('xab-balance')
  );

  add(
    '第 1 局盈虧更新',
    '-4.00',
    text('xab-profit')
  );

  add(
    '剩餘轉數更新',
    '49',
    text('xab-remaining')
  );

  LP.pause();

  add(
    '暫停狀態',
    'PAUSED',
    L.getState().status
  );

  LP.resume();

  LP.tickOnce();

  add(
    '第 2 局點數更新',
    '2004.00',
    text('xab-balance')
  );

  LP.stop();

  add(
    '停止狀態',
    'STOPPED',
    L.getState().status
  );

  let passed = 0;

  const html =
    tests.map(test => {

      if (test.ok) {
        passed++;
      }

      return `
        <div class="${test.ok ? 'ok' : 'fail'}">
          ${test.ok ? '✅' : '❌'}
          ${test.name}
          ｜預期：${test.expected}
          ｜實際：${test.actual}
        </div>
      `;

    }).join('');

  box.innerHTML =
    html +
    `<hr><b>結果：${passed} / ${tests.length} 通過</b>`;

})();
</script>

</body>
</html>
