<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>芯瑤 AutoBet Simulator 測試</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:30px 16px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif;
  background:#fff6fa;
  color:#59434d;
}
.wrap{width:min(800px,100%);margin:auto}
.card{
  background:#fff;
  border:1px solid #ffd3e3;
  border-radius:20px;
  padding:20px;
  margin-bottom:16px;
}
h1{margin-top:0;color:#ef377e}
.notice{
  padding:12px;
  border-radius:12px;
  background:#fff0f6;
  line-height:1.7;
}
.ok{color:#16865b;font-weight:900;line-height:1.9}
.fail{color:#d83d58;font-weight:900;line-height:1.9}
</style>
</head>

<body>

<div class="wrap">

  <div class="card">
    <h1>🌸 芯瑤 AutoBet Simulator 測試</h1>

    <div class="notice">
      ⚠️ 只模擬「一局完成後」資料怎麼更新。<br>
      不會按 Spin、不會改注、不會操作真正 ATG。
    </div>
  </div>

  <div class="card">
    <h3>🧪 Simulator 測試</h3>
    <div id="result">測試中…</div>
  </div>

</div>

<script src="./xinyao_ATG_autobet_engine.js"></script>
<script src="./xinyao_ATG_autobet_strategy.js"></script>
<script src="./xinyao_ATG_autobet_controller.js"></script>
<script src="./xinyao_ATG_autobet_runner.js"></script>
<script src="./xinyao_ATG_autobet_session.js"></script>
<script src="./xinyao_ATG_autobet_simulator.js"></script>

<script>
(() => {

  const box = document.getElementById('result');

  if (!window.XinyaoAutoBetSimulator) {
    box.innerHTML =
      '<div class="fail">❌ Simulator 尚未建立｜這次失敗是正常的</div>';
    return;
  }

  const S = window.XinyaoAutoBetSession;
  const M = window.XinyaoAutoBetSimulator;

  const tests = [];

  function add(name, expected, actual) {
    tests.push({
      name,
      expected: String(expected),
      actual: String(actual),
      ok: String(expected) === String(actual)
    });
  }

  S.reset({
    startBalance: 2000,
    balance: 2000,
    takeProfit: 1000,
    stopLoss: 800,
    maxSpins: 100
  });

  M.reset();

  let result = M.step({
    balance: 1996,
    freeGameActive: false
  });

  add(
    '第 1 轉完成',
    1,
    S.getState().totalSpins
  );

  add(
    '第 1 轉盈虧',
    -4,
    S.getState().profit
  );

  add(
    '第 1 轉剩餘轉數',
    49,
    result.decision.remainingStageSpins
  );

  result = M.step({
    balance: 2004,
    freeGameActive: false
  });

  add(
    '第 2 轉完成',
    2,
    S.getState().totalSpins
  );

  add(
    '第 2 轉盈虧',
    4,
    S.getState().profit
  );

  result = M.step({
    balance: 3000,
    freeGameActive: false
  });

  add(
    '達止盈後停止',
    'STOP',
    result.decision.action
  );

  add(
    '停止原因',
    'TAKE_PROFIT',
    result.decision.reason
  );

  let passed = 0;

  const html = tests.map(t => {

    if (t.ok) passed++;

    return `
      <div class="${t.ok ? 'ok' : 'fail'}">
        ${t.ok ? '✅' : '❌'}
        ${t.name}
        ｜預期：${t.expected}
        ｜實際：${t.actual}
      </div>
    `;

  }).join('');

  box.innerHTML =
    html +
    `<hr><b>結果：${passed} / ${tests.length} 通過</b>`;

})();
</script>

</body>
</html>
