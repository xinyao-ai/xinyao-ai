<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>芯瑤💕ATG AI助手</title>

  <meta
    name="description"
    content="依據個人實戰累積的選房邏輯，綜合得分率、未開、前一、前二及本金進行分析。"
  >

  <meta name="theme-color" content="#ffddea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="芯瑤選房分析">

  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="icon" href="./favicon.png" type="image/png">

  <style>
    :root {
      --pink: #ff5f9e;
      --pink-dark: #ef377e;
      --pink-light: #fff0f6;
      --pink-soft: #ffdbea;
      --text: #2d2730;
      --muted: #817782;
      --white: #ffffff;
      --border: #f0dbe4;
      --shadow: 0 15px 45px rgba(229, 92, 148, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #fff8fb;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang TC",
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
      background:
        radial-gradient(circle at top left, #ffe5f0 0, transparent 35%),
        radial-gradient(circle at bottom right, #f7e7ff 0, transparent 35%),
        linear-gradient(180deg, #fffafd 0%, #fff4f8 100%);
    }

    button,
    input,
    select {
      font: inherit;
    }

    .page {
      width: min(100%, 760px);
      margin: 0 auto;
      padding:
        calc(24px + env(safe-area-inset-top))
        16px
        calc(36px + env(safe-area-inset-bottom));
    }

    .hero {
      margin-bottom: 18px;
      padding: 22px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 28px;
      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.94),
          rgba(255, 239, 246, 0.94)
        );
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: 62px;
      height: 62px;
      flex: 0 0 62px;
      object-fit: cover;
      border: 3px solid var(--white);
      border-radius: 20px;
      box-shadow: 0 8px 22px rgba(238, 72, 139, 0.22);
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 6vw, 34px);
      line-height: 1.2;
      letter-spacing: -0.5px;
    }

    .subtitle {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .card {
      margin-top: 18px;
      padding: 20px;
      border: 1px solid rgba(240, 219, 228, 0.9);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: var(--shadow);
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 16px;
      font-size: 19px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      padding-left: 3px;
      color: #554b56;
      font-size: 14px;
      font-weight: 700;
    }

    input,
    select {
      width: 100%;
      min-height: 52px;
      padding: 0 15px;
      color: var(--text);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      outline: none;
      background: #fffafd;
      transition:
        border-color 0.18s ease,
        box-shadow 0.18s ease,
        transform 0.18s ease;
    }

    input:focus,
    select:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 4px rgba(255, 95, 158, 0.12);
    }

    input::placeholder {
      color: #b6abb1;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      min-height: 52px;
      border: 0;
      border-radius: 17px;
      cursor: pointer;
      font-weight: 800;
      transition:
        transform 0.15s ease,
        opacity 0.15s ease,
        box-shadow 0.15s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    .primary {
      flex: 1;
      color: var(--white);
      background: linear-gradient(135deg, var(--pink), var(--pink-dark));
      box-shadow: 0 10px 24px rgba(239, 55, 126, 0.28);
    }

    .secondary {
      width: 100px;
      color: var(--pink-dark);
      background: var(--pink-light);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.62;
      box-shadow: none;
    }

    .result-card {
      display: none;
      overflow: hidden;
    }

    .result-card.show {
      display: block;
      animation: appear 0.25s ease;
    }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 15px;
    }

    .result-badge {
      padding: 7px 11px;
      color: var(--pink-dark);
      border-radius: 999px;
      background: var(--pink-light);
      font-size: 13px;
      font-weight: 800;
    }

    .result-content {
      min-height: 120px;
      padding: 17px;
      overflow-wrap: anywhere;
      color: #393039;
      border: 1px solid #f4e0e9;
      border-radius: 18px;
      background: #fffbfd;
      font-size: 15px;
      line-height: 1.8;
      white-space: pre-wrap;
    }

    .loading {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 100px;
      color: var(--muted);
      font-weight: 700;
    }

    .loading.show {
      display: flex;
    }

    .spinner {
      width: 22px;
      height: 22px;
      border: 3px solid var(--pink-soft);
      border-top-color: var(--pink);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    .error {
      color: #b4234c;
      border-color: #ffd0dc;
      background: #fff1f5;
    }

    .notice {
      margin: 15px 4px 0;
      color: #91858e;
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }


    .mode-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 18px;
    }

    .mode-button {
      min-height: 56px;
      padding: 10px;
      color: var(--pink-dark);
      border: 1.5px solid var(--pink-soft);
      border-radius: 17px;
      background: var(--pink-light);
      font-weight: 800;
    }

    .mode-button.active {
      color: var(--white);
      border-color: transparent;
      background: linear-gradient(135deg, var(--pink), var(--pink-dark));
      box-shadow: 0 10px 24px rgba(239, 55, 126, 0.24);
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
      animation: appear 0.2s ease;
    }

    .history-empty {
      padding: 20px;
      color: var(--muted);
      text-align: center;
    }

    .history-item {
      padding: 15px;
      border: 1px solid #f4e0e9;
      border-radius: 17px;
      background: #fffbfd;
    }

    .history-item + .history-item {
      margin-top: 10px;
    }

    .history-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 7px;
      font-weight: 800;
    }

    .history-time {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .history-summary {
      color: #5e535c;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 560px) {
      .page {
        padding-left: 12px;
        padding-right: 12px;
      }

      .hero,
      .card {
        padding: 17px;
        border-radius: 23px;
      }

      .brand-icon {
        width: 54px;
        height: 54px;
        flex-basis: 54px;
        border-radius: 17px;
      }

      .mode-grid,
      .form-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .actions {
        flex-direction: column-reverse;
      }

      .secondary {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div id="loginPage" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#fff5fa,#fde9f4);">
  <div style="width:100%;max-width:420px;background:#fff;border:1px solid #f3d3e1;border-radius:28px;padding:32px;box-shadow:0 18px 50px rgba(229,92,148,.16);">
    <div style="text-align:center;margin-bottom:24px;">
      <img src="./icon-192.png" alt="芯瑤" style="width:84px;height:84px;border-radius:24px;object-fit:cover;box-shadow:0 10px 25px rgba(229,92,148,.22);">
      <h2 style="margin:16px 0 8px;font-size:28px;">芯瑤💕會員登入</h2>
      <p style="margin:0;color:#817782;">請輸入已開通的會員帳號</p>
    </div>

    <label for="memberAccount" style="display:block;margin-bottom:8px;font-weight:700;">會員帳號</label>

    <input
      id="memberAccount"
      type="text"
      placeholder="請輸入會員帳號"
      autocomplete="username"
      style="width:100%;padding:16px;border:1px solid #efccdc;border-radius:16px;font-size:16px;box-sizing:border-box;outline:none;"
    >

    <button
      id="loginButton"
      type="button"
      style="width:100%;margin-top:16px;padding:16px;border:0;border-radius:16px;background:linear-gradient(90deg,#ff58a0,#ef2f80);color:#fff;font-size:18px;font-weight:800;cursor:pointer;"
    >
      登入
    </button>

    <div
      id="loginMessage"
      style="display:none;margin-top:16px;padding:14px;border-radius:14px;background:#fff0f6;color:#d6296f;line-height:1.6;"
    ></div>
  </div>
</div>
  <main id="appPage" class="page" style="display:none;">
    <section class="hero">
      <div class="brand">
        <img
          class="brand-icon"
          src="./icon-192.png"
          alt="芯瑤選房分析"
          onerror="this.src='./apple-touch-icon.png'"
        >

        <div>
          <h1>芯瑤💕ATG AI助手</h1>

          <p class="subtitle">
            房號分析、續玩判讀與個人近期紀錄，一個頁面全部搞定。
          </p>
        </div>
      </div>
    </section>

    <section class="card" style="padding:14px;">
      <div class="mode-grid" style="margin-top:0;">
        <button class="mode-button active" data-panel="analyzePanel" type="button">🎰 房號分析</button>
        <button class="mode-button" data-panel="continuePanel" type="button">🔄 續玩分析</button>
        <button class="mode-button" data-panel="historyPanel" type="button">📜 分析紀錄</button>
      </div>
    </section>

    <section class="panel active" id="analyzePanel">
      <div class="card">
        <h2 class="section-title">🎰 輸入房號資料</h2>

      <form id="analysisForm">
        <div class="form-grid">
          <div class="field full">
            <label for="game">遊戲</label>

            <select id="game" required>
              <option value="">請選擇遊戲</option>
              <option value="🔥戰神賽特">🔥 戰神賽特</option>
              <option value="🔥戰神賽特II">🔥 戰神賽特II</option>
              <option value="😈古神巴風特">😈 古神巴風特</option>
              <option value="🎋赤三國">🎋 赤三國</option>
              <option value="🐵孫行者">🐵 孫行者</option>
              <option value="🗡️武俠">🗡️ 武俠</option>
              <option value="🐯虎小妹">🐯 虎小妹</option>
            </select>
          </div>

          <div class="field">
            <label for="room">房號</label>

            <input
              id="room"
              type="text"
              inputmode="numeric"
              placeholder="例如：417"
              required
            >
          </div>

          <div class="field">
            <label for="score">得分率</label>

            <input
              id="score"
              type="number"
              inputmode="decimal"
              step="0.01"
              placeholder="例如：149.95"
              required
            >
          </div>

          <div class="field">
            <label for="unopen">未開</label>

            <input
              id="unopen"
              type="number"
              inputmode="decimal"
              step="0.01"
              placeholder="請輸入未開"
              required
            >
          </div>

          <div class="field">
            <label for="prev1">前一</label>

            <input
              id="prev1"
              type="number"
              inputmode="decimal"
              step="0.01"
              placeholder="請輸入前一"
              required
            >
          </div>

          <div class="field">
            <label for="prev2">前二</label>

            <input
              id="prev2"
              type="number"
              inputmode="decimal"
              step="0.01"
              placeholder="請輸入前二"
              required
            >
          </div>

          <div class="field">
            <label for="capital">本金</label>

            <input
              id="capital"
              type="number"
              inputmode="numeric"
              min="1"
              step="1"
              placeholder="例如：2000"
              required
            >
          </div>
        </div>

        <div class="actions">
          <button
            class="secondary"
            id="clearButton"
            type="button"
          >
            清除
          </button>

          <button
            class="primary"
            id="submitButton"
            type="submit"
          >
            開始分析
          </button>
        </div>
      </form>
      </div>
    </section>

    <section class="panel" id="continuePanel">
      <div class="card">
        <h2 class="section-title">🔄 輸入續玩資料</h2>

        <form id="continueForm">
          <div class="form-grid">
            <div class="field full">
              <label for="continueGame">遊戲</label>
              <select id="continueGame" required>
                <option value="">請選擇遊戲</option>
                <option value="🔥戰神賽特">🔥 戰神賽特</option>
                <option value="🔥戰神賽特II">🔥 戰神賽特II</option>
                <option value="😈古神巴風特">😈 古神巴風特</option>
                <option value="🎋赤三國">🎋 赤三國</option>
                <option value="🐵孫行者">🐵 孫行者</option>
                <option value="🗡️武俠">🗡️ 武俠</option>
                <option value="🐯虎小妹">🐯 虎小妹</option>
              </select>
            </div>

            <div class="field">
              <label for="continueRoom">房號</label>
              <input id="continueRoom" type="text" inputmode="numeric" placeholder="例如：417" required>
            </div>

            <div class="field">
              <label for="continueCapital">原始本金</label>
              <input id="continueCapital" type="number" inputmode="numeric" min="1" step="1" placeholder="例如：5000" required>
            </div>

            <div class="field">
              <label for="currentBalance">目前餘額</label>
              <input id="currentBalance" type="number" inputmode="decimal" min="0" step="0.01" placeholder="例如：4700" required>
            </div>

            <div class="field">
              <label for="freeGameCount">免遊次數</label>
              <input id="freeGameCount" type="number" inputmode="numeric" min="0" step="1" placeholder="例如：0" required>
            </div>

            <div class="field">
              <label for="maxWin">最高單次中獎</label>
              <input id="maxWin" type="number" inputmode="decimal" min="0" step="0.01" placeholder="例如：120" required>
            </div>

            <div class="field">
              <label for="playDuration">目前玩多久</label>
              <select id="playDuration" required>
                <option value="">請選擇</option>
                <option value="剛開始">剛開始</option>
                <option value="約50轉">約 50 轉</option>
                <option value="約100轉">約 100 轉</option>
                <option value="玩很久了">玩很久了</option>
              </select>
            </div>

            <div class="field">
              <label for="continueStatus">目前狀況</label>
              <select id="continueStatus" required>
                <option value="">請選擇</option>
                <option value="一直掉分">一直掉分</option>
                <option value="持平">持平</option>
                <option value="開始回分">開始回分</option>
                <option value="已進免遊">已進免遊</option>
                <option value="已爆分">已爆分</option>
              </select>
            </div>
          </div>

          <div class="actions">
            <button class="secondary" id="continueClearButton" type="button">清除</button>
            <button class="primary" id="continueSubmitButton" type="submit">開始續玩分析</button>
          </div>
        </form>
      </div>
    </section>

    <section class="panel" id="historyPanel">
      <div class="card">
        <div class="result-header">
          <h2 class="section-title" style="margin:0;">📜 近期分析紀錄</h2>
          <button id="clearHistoryButton" type="button" class="secondary" style="width:auto;min-height:40px;padding:0 14px;">清空</button>
        </div>
        <div id="historyList"></div>
      </div>
    </section>

    <section class="card result-card" id="resultCard">
      <div class="result-header">
        <h2 class="section-title" style="margin:0;">
          ✨ 分析結果
        </h2>

        <span class="result-badge" id="resultBadge">
          分析完成
        </span>
      </div>

      <div class="loading" id="loading">
        <span class="spinner"></span>
        正在分析房間數據…
      </div>

      <div class="result-content" id="resultContent"></div>
    </section>

    <p class="notice">
      ※ 分析結果僅依輸入數據及設定規則計算，不代表任何結果保證，請自行控管資金與風險。
    </p>
  </main>

  <script>
    const WORKER_URL =
      "https://holy-violet-41e1.love06130430.workers.dev";

    const $ = (id) => document.getElementById(id);
    const loginPage = $("loginPage");
    const appPage = $("appPage");
    const memberAccountInput = $("memberAccount");
    const loginButton = $("loginButton");
    const loginMessage = $("loginMessage");
    const analysisForm = $("analysisForm");
    const continueForm = $("continueForm");
    const submitButton = $("submitButton");
    const continueSubmitButton = $("continueSubmitButton");
    const resultCard = $("resultCard");
    const resultContent = $("resultContent");
    const resultBadge = $("resultBadge");
    const loading = $("loading");
    const historyList = $("historyList");

    let loggedInMember = sessionStorage.getItem("memberAccount") || "";

    function numberValue(id) {
      return Number($(id).value.trim());
    }

    function showLoginMessage(message) {
      loginMessage.textContent = message;
      loginMessage.style.display = "block";
    }

    function openAnalyzer(memberAccount) {
      loggedInMember = memberAccount;
      sessionStorage.setItem("memberAccount", memberAccount);
      loginMessage.style.display = "none";
      loginPage.style.display = "none";
      appPage.style.display = "block";
      renderHistory();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function verifyMember() {
      const memberAccount = memberAccountInput.value.trim();

      if (!memberAccount) {
        showLoginMessage("請輸入會員帳號");
        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = "驗證中…";
      loginMessage.style.display = "none";

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "verify",
            memberAccount
          })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(
            data.message ||
            data.error ||
            "會員帳號不存在或尚未開通 AI 使用權限"
          );
        }

        openAnalyzer(memberAccount);
      } catch (error) {
        showLoginMessage(error.message || "登入失敗，請稍後再試");
      } finally {
        loginButton.disabled = false;
        loginButton.textContent = "登入";
      }
    }

    function showLoading(button, text) {
      resultCard.classList.add("show");
      loading.classList.add("show");
      resultContent.style.display = "none";
      resultContent.classList.remove("error");
      resultBadge.textContent = "分析中";
      button.disabled = true;
      button.textContent = text;
      resultCard.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function restoreButtons() {
      submitButton.disabled = false;
      submitButton.textContent = "開始分析";
      continueSubmitButton.disabled = false;
      continueSubmitButton.textContent = "開始續玩分析";
    }

    function showResult(text) {
      loading.classList.remove("show");
      resultContent.style.display = "block";
      resultContent.classList.remove("error");
      resultContent.textContent = text;
      resultBadge.textContent = "分析完成";
      restoreButtons();
    }

    function showError(message) {
      loading.classList.remove("show");
      resultContent.style.display = "block";
      resultContent.classList.add("error");
      resultContent.textContent = message;
      resultBadge.textContent = "發生錯誤";
      restoreButtons();
    }

    function historyKey() {
      return `xinyao_history_${loggedInMember}`;
    }

    function getHistory() {
      try {
        return JSON.parse(localStorage.getItem(historyKey()) || "[]");
      } catch {
        return [];
      }
    }

    function addHistory(type, game, room, result) {
      const history = getHistory();

      history.unshift({
        type,
        game,
        room,
        result,
        createdAt: new Date().toISOString()
      });

      localStorage.setItem(
        historyKey(),
        JSON.stringify(history.slice(0, 30))
      );

      renderHistory();
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function renderHistory() {
      const history = getHistory();

      if (!history.length) {
        historyList.innerHTML =
          '<div class="history-empty">目前還沒有分析紀錄。</div>';
        return;
      }

      historyList.innerHTML = history.map((item) => {
        const time = new Date(item.createdAt).toLocaleString("zh-TW");
        const summary = item.result.length > 160
          ? `${item.result.slice(0, 160)}…`
          : item.result;

        return `
          <article class="history-item">
            <div class="history-top">
              <span>${escapeHtml(item.type)}｜${escapeHtml(item.game)}｜房號 ${escapeHtml(item.room)}</span>
              <span class="history-time">${escapeHtml(time)}</span>
            </div>
            <div class="history-summary">${escapeHtml(summary)}</div>
          </article>
        `;
      }).join("");
    }

    async function sendAnalysis(payload, button, loadingText, historyType) {
      if (!loggedInMember) {
        loginPage.style.display = "flex";
        appPage.style.display = "none";
        showLoginMessage("登入狀態已失效，請重新輸入會員帳號");
        return;
      }

      showLoading(button, loadingText);

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        let data;

        try {
          data = await response.json();
        } catch {
          throw new Error("伺服器回傳格式錯誤");
        }

        if (!response.ok) {
          const detail =
            data?.detail?.message ||
            data?.detail ||
            data?.error ||
            `請求失敗：${response.status}`;

          throw new Error(
            typeof detail === "string"
              ? detail
              : JSON.stringify(detail)
          );
        }

        if (!data.result) {
          throw new Error("沒有收到分析結果");
        }

        showResult(data.result);
        addHistory(historyType, payload.game, payload.room, data.result);
      } catch (error) {
        console.error(error);
        showError(`分析失敗：${error.message}`);
      }
    }

    analysisForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const payload = {
        action: "analyze",
        memberAccount: loggedInMember,
        game: $("game").value,
        room: $("room").value.trim(),
        score: numberValue("score"),
        unopen: numberValue("unopen"),
        prev1: numberValue("prev1"),
        prev2: numberValue("prev2"),
        capital: numberValue("capital")
      };

      const invalid =
        !payload.game ||
        !payload.room ||
        !Number.isFinite(payload.score) ||
        !Number.isFinite(payload.unopen) ||
        !Number.isFinite(payload.prev1) ||
        !Number.isFinite(payload.prev2) ||
        !Number.isFinite(payload.capital);

      if (invalid) {
        resultCard.classList.add("show");
        showError("資料沒有填完整，請檢查所有欄位。");
        return;
      }

      await sendAnalysis(payload, submitButton, "分析中…", "房號分析");
    });

    continueForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const payload = {
        action: "continue",
        memberAccount: loggedInMember,
        game: $("continueGame").value,
        room: $("continueRoom").value.trim(),
        capital: numberValue("continueCapital"),
        current_balance: numberValue("currentBalance"),
        free_game_count: numberValue("freeGameCount"),
        max_win: numberValue("maxWin"),
        play_duration: $("playDuration").value,
        status: $("continueStatus").value
      };

      const invalid =
        !payload.game ||
        !payload.room ||
        !payload.play_duration ||
        !payload.status ||
        !Number.isFinite(payload.capital) ||
        !Number.isFinite(payload.current_balance) ||
        !Number.isFinite(payload.free_game_count) ||
        !Number.isFinite(payload.max_win);

      if (invalid) {
        resultCard.classList.add("show");
        showError("續玩資料沒有填完整，請檢查所有欄位。");
        return;
      }

      await sendAnalysis(
        payload,
        continueSubmitButton,
        "續玩分析中…",
        "續玩分析"
      );
    });

    $("clearButton").addEventListener("click", () => {
      analysisForm.reset();
      resultCard.classList.remove("show");
    });

    $("continueClearButton").addEventListener("click", () => {
      continueForm.reset();
      resultCard.classList.remove("show");
    });

    $("clearHistoryButton").addEventListener("click", () => {
      if (!confirm("確定要清空自己的分析紀錄嗎？")) {
        return;
      }

      localStorage.removeItem(historyKey());
      renderHistory();
    });

    document.querySelectorAll(".mode-button").forEach((button) => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".mode-button").forEach((item) => {
          item.classList.remove("active");
        });

        document.querySelectorAll(".panel").forEach((panel) => {
          panel.classList.remove("active");
        });

        button.classList.add("active");
        $(button.dataset.panel).classList.add("active");
        resultCard.classList.remove("show");

        if (button.dataset.panel === "historyPanel") {
          renderHistory();
        }

        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });

    loginButton.addEventListener("click", verifyMember);

    memberAccountInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        verifyMember();
      }
    });

    if (loggedInMember) {
      memberAccountInput.value = loggedInMember;
      openAnalyzer(loggedInMember);
    }

    // 停用 Service Worker，避免 GitHub Pages 長期讀到舊版快取。
  </script>
</body>
</html>
