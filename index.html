<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>芯瑤💕ATG AI助手</title>

  <meta
    name="description"
    content="依據個人實戰累積的選房邏輯，綜合得分率、未開、前一、前二及本金進行分析。"
  >

  <meta name="theme-color" content="#ffddea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="芯瑤選房分析">

  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="icon" href="./favicon.png" type="image/png">

  <style>
    :root {
      --pink: #ff5f9e;
      --pink-dark: #ef377e;
      --pink-light: #fff0f6;
      --pink-soft: #ffdbea;
      --text: #2d2730;
      --muted: #817782;
      --white: #ffffff;
      --border: #f0dbe4;
      --shadow: 0 15px 45px rgba(229, 92, 148, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #fff8fb;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang TC",
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
      background:
        radial-gradient(circle at top left, #ffe5f0 0, transparent 35%),
        radial-gradient(circle at bottom right, #f7e7ff 0, transparent 35%),
        linear-gradient(180deg, #fffafd 0%, #fff4f8 100%);
    }

    button,
    input,
    select {
      font: inherit;
    }

    .page {
      width: min(100%, 760px);
      margin: 0 auto;
      padding:
        calc(24px + env(safe-area-inset-top))
        16px
        calc(36px + env(safe-area-inset-bottom));
    }

    .hero {
      margin-bottom: 18px;
      padding: 22px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 28px;
      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.94),
          rgba(255, 239, 246, 0.94)
        );
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: 62px;
      height: 62px;
      flex: 0 0 62px;
      object-fit: cover;
      border: 3px solid var(--white);
      border-radius: 20px;
      box-shadow: 0 8px 22px rgba(238, 72, 139, 0.22);
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 6vw, 34px);
      line-height: 1.2;
      letter-spacing: -0.5px;
    }

    .subtitle {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .card {
      margin-top: 18px;
      padding: 20px;
      border: 1px solid rgba(240, 219, 228, 0.9);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: var(--shadow);
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 16px;
      font-size: 19px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      padding-left: 3px;
      color: #554b56;
      font-size: 14px;
      font-weight: 700;
    }

    input,
    select {
      width: 100%;
      min-height: 52px;
      padding: 0 15px;
      color: var(--text);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      outline: none;
      background: #fffafd;
      transition:
        border-color 0.18s ease,
        box-shadow 0.18s ease,
        transform 0.18s ease;
    }

    input:focus,
    select:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 4px rgba(255, 95, 158, 0.12);
    }

    input::placeholder {
      color: #b6abb1;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      min-height: 52px;
      border: 0;
      border-radius: 17px;
      cursor: pointer;
      font-weight: 800;
      transition:
        transform 0.15s ease,
        opacity 0.15s ease,
        box-shadow 0.15s ease;
    }

    button:active {
      transform: scale(0.98);
    }

    .primary {
      flex: 1;
      color: var(--white);
      background: linear-gradient(135deg, var(--pink), var(--pink-dark));
      box-shadow: 0 10px 24px rgba(239, 55, 126, 0.28);
    }

    .secondary {
      width: 100px;
      color: var(--pink-dark);
      background: var(--pink-light);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.62;
      box-shadow: none;
    }

    .result-card {
      display: none;
      overflow: hidden;
    }

    .result-card.show {
      display: block;
      animation: appear 0.25s ease;
    }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 15px;
    }

    .result-badge {
      padding: 7px 11px;
      color: var(--pink-dark);
      border-radius: 999px;
      background: var(--pink-light);
      font-size: 13px;
      font-weight: 800;
    }

    .result-content {
      min-height: 120px;
      padding: 17px;
      overflow-wrap: anywhere;
      color: #393039;
      border: 1px solid #f4e0e9;
      border-radius: 18px;
      background: #fffbfd;
      font-size: 15px;
      line-height: 1.8;
      white-space: pre-wrap;
    }

    .loading {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 100px;
      color: var(--muted);
      font-weight: 700;
    }

    .loading.show {
      display: flex;
    }

    .spinner {
      width: 22px;
      height: 22px;
      border: 3px solid var(--pink-soft);
      border-top-color: var(--pink);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    .error {
      color: #b4234c;
      border-color: #ffd0dc;
      background: #fff1f5;
    }

    .notice {
      margin: 15px 4px 0;
      color: #91858e;
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }


    .mode-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 18px;
    }

    .mode-button {
      min-height: 56px;
      padding: 10px;
      color: var(--pink-dark);
      border: 1.5px solid var(--pink-soft);
      border-radius: 17px;
      background: var(--pink-light);
      font-weight: 800;
    }

    .mode-button.active {
      color: var(--white);
      border-color: transparent;
      background: linear-gradient(135deg, var(--pink), var(--pink-dark));
      box-shadow: 0 10px 24px rgba(239, 55, 126, 0.24);
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
      animation: appear 0.2s ease;
    }

    .history-empty {
      padding: 20px;
      color: var(--muted);
      text-align: center;
    }

    .history-item {
      padding: 15px;
      border: 1px solid #f4e0e9;
      border-radius: 17px;
      background: #fffbfd;
    }

    .history-item + .history-item {
      margin-top: 10px;
    }

    .history-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 7px;
      font-weight: 800;
    }

    .history-time {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .history-summary {
      color: #5e535c;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 560px) {
      .page {
        padding-left: 12px;
        padding-right: 12px;
      }

      .hero,
      .card {
        padding: 17px;
        border-radius: 23px;
      }

      .brand-icon {
        width: 54px;
        height: 54px;
        flex-basis: 54px;
        border-radius: 17px;
      }

      .mode-grid,
      .form-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .actions {
        flex-direction: column-reverse;
      }

      .secondary {
        width: 100%;
      }
    }

    /* ===== 芯瑤淡粉動畫升級 ===== */
    body {
      position: relative;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: -3;
      border-radius: 999px;
      pointer-events: none;
      opacity: .72;
      animation: floatGlow 12s ease-in-out infinite alternate;
    }

    body::before {
      width: 360px;
      height: 360px;
      top: -90px;
      left: -120px;
      background: radial-gradient(circle, rgba(255,195,221,.62), rgba(255,226,239,.18) 62%, transparent 72%);
    }

    body::after {
      width: 420px;
      height: 420px;
      right: -160px;
      bottom: -120px;
      background: radial-gradient(circle, rgba(236,216,255,.52), rgba(255,226,241,.14) 64%, transparent 74%);
      animation-delay: -4s;
    }

    .ambient-layer {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      overflow: hidden;
    }

    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      opacity: .45;
      background: linear-gradient(135deg, rgba(255,255,255,.92), rgba(255,199,224,.5));
      box-shadow: 0 0 40px rgba(255,144,190,.22);
      animation: driftOrb 14s ease-in-out infinite;
    }

    .ambient-orb:nth-child(1) {
      width: 95px;
      height: 95px;
      left: 8%;
      top: 18%;
    }

    .ambient-orb:nth-child(2) {
      width: 72px;
      height: 72px;
      right: 9%;
      top: 36%;
      animation-delay: -5s;
      animation-duration: 17s;
    }

    .ambient-orb:nth-child(3) {
      width: 120px;
      height: 120px;
      left: 18%;
      bottom: 10%;
      animation-delay: -9s;
      animation-duration: 19s;
    }

    .ambient-sparkle {
      position: absolute;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255,255,255,.95);
      box-shadow: 0 0 12px rgba(255,255,255,.95), 0 0 22px rgba(255,145,191,.55);
      animation: sparkle 3.6s ease-in-out infinite;
    }

    .ambient-sparkle:nth-of-type(4) { left: 18%; top: 14%; }
    .ambient-sparkle:nth-of-type(5) { right: 22%; top: 24%; animation-delay: -1.2s; }
    .ambient-sparkle:nth-of-type(6) { left: 28%; bottom: 22%; animation-delay: -2.1s; }
    .ambient-sparkle:nth-of-type(7) { right: 13%; bottom: 16%; animation-delay: -.6s; }

    #loginPage {
      background: transparent !important;
      animation: pageFade .65s ease both;
    }

    #loginPage > div {
      position: relative;
      overflow: hidden;
      border-color: rgba(255,214,231,.86) !important;
      background: linear-gradient(145deg, rgba(255,255,255,.96), rgba(255,247,251,.94)) !important;
      box-shadow: 0 22px 70px rgba(222,103,154,.18), inset 0 1px 0 rgba(255,255,255,.92) !important;
      backdrop-filter: blur(18px);
      animation: cardEnter .72s cubic-bezier(.2,.8,.2,1) both;
    }

    #loginPage > div::before {
      content: "";
      position: absolute;
      width: 160px;
      height: 160px;
      right: -55px;
      top: -60px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,214,230,.75), rgba(255,214,230,0));
      pointer-events: none;
    }

    #loginPage img,
    .brand-icon {
      animation: logoFloat 4s ease-in-out infinite;
    }

    #memberAccount {
      transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease !important;
      background: rgba(255,250,253,.96) !important;
    }

    #memberAccount:focus {
      border-color: #ff77ad !important;
      box-shadow: 0 0 0 5px rgba(255,119,173,.13), 0 8px 22px rgba(238,95,154,.08) !important;
      transform: translateY(-1px);
    }

    #loginButton {
      position: relative;
      overflow: hidden;
      box-shadow: 0 12px 28px rgba(239,47,128,.25);
      animation: softPulse 3s ease-in-out infinite;
    }

    #loginButton::after,
    .primary::after {
      content: "";
      position: absolute;
      inset: -50% auto -50% -35%;
      width: 34%;
      transform: skewX(-20deg);
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.48), transparent);
      animation: shine 3.8s ease-in-out infinite;
      pointer-events: none;
    }

    .hero,
    .card {
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(16px);
      transition: transform .28s ease, box-shadow .28s ease, border-color .28s ease;
    }

    .hero::after,
    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(130deg, rgba(255,255,255,.35), transparent 38%, rgba(255,226,239,.16));
      opacity: .7;
    }

    .hero {
      animation: heroEnter .7s cubic-bezier(.2,.8,.2,1) both;
    }

    .card {
      animation: cardEnter .62s cubic-bezier(.2,.8,.2,1) both;
    }

    .panel.active .card {
      animation: panelEnter .42s cubic-bezier(.2,.8,.2,1) both;
    }

    .mode-button {
      position: relative;
      overflow: hidden;
      transition: transform .22s ease, box-shadow .22s ease, background .22s ease, color .22s ease;
    }

    .mode-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(239,55,126,.12);
    }

    .mode-button.active {
      animation: selectedPop .32s ease both;
    }

    input:focus,
    select:focus {
      transform: translateY(-1px);
      box-shadow: 0 0 0 5px rgba(255, 95, 158, 0.10), 0 10px 22px rgba(239,55,126,.08);
    }

    .primary {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #ff8fba 0%, #ff5f9e 45%, #ef4b8d 100%);
      box-shadow: 0 12px 28px rgba(239,55,126,.24), inset 0 1px 0 rgba(255,255,255,.28);
      animation: softPulse 3.2s ease-in-out infinite;
    }

    .primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 34px rgba(239,55,126,.3), inset 0 1px 0 rgba(255,255,255,.28);
    }

    .secondary:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(239,55,126,.08);
    }

    .result-card.show {
      display: block;
      animation: resultReveal .55s cubic-bezier(.16,.84,.44,1) both;
    }

    .result-badge {
      box-shadow: inset 0 1px 0 rgba(255,255,255,.85);
      animation: badgeGlow 2.8s ease-in-out infinite;
    }

    .loading.show {
      animation: loadingFade .25s ease both;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border-width: 3px;
      box-shadow: 0 0 18px rgba(255,95,158,.18);
    }

    .loading::after {
      content: "•••";
      margin-left: 2px;
      letter-spacing: 4px;
      color: #f07fac;
      animation: dots 1.2s steps(4, end) infinite;
    }

    .history-item {
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
      animation: historyEnter .45s ease both;
    }

    .history-item:hover {
      transform: translateY(-2px);
      border-color: #efc9d9;
      box-shadow: 0 12px 24px rgba(223,94,147,.09);
    }

    @keyframes pageFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes floatGlow {
      from { transform: translate3d(0,0,0) scale(1); }
      to { transform: translate3d(30px,24px,0) scale(1.08); }
    }

    @keyframes driftOrb {
      0%, 100% { transform: translate3d(0,0,0) scale(1); }
      35% { transform: translate3d(24px,-20px,0) scale(1.06); }
      70% { transform: translate3d(-16px,22px,0) scale(.96); }
    }

    @keyframes sparkle {
      0%, 100% { opacity: .18; transform: scale(.7); }
      50% { opacity: .95; transform: scale(1.35); }
    }

    @keyframes logoFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-5px) rotate(.8deg); }
    }

    @keyframes heroEnter {
      from { opacity: 0; transform: translateY(-10px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(14px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes panelEnter {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes resultReveal {
      0% { opacity: 0; transform: translateY(18px) scale(.98); }
      70% { transform: translateY(-2px) scale(1.005); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes selectedPop {
      0% { transform: scale(.96); }
      70% { transform: scale(1.025); }
      100% { transform: scale(1); }
    }

    @keyframes softPulse {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.045); }
    }

    @keyframes shine {
      0%, 58% { left: -40%; opacity: 0; }
      66% { opacity: .7; }
      78% { left: 115%; opacity: 0; }
      100% { left: 115%; opacity: 0; }
    }

    @keyframes badgeGlow {
      0%, 100% { box-shadow: 0 0 0 rgba(255,95,158,0), inset 0 1px 0 rgba(255,255,255,.85); }
      50% { box-shadow: 0 0 18px rgba(255,95,158,.14), inset 0 1px 0 rgba(255,255,255,.85); }
    }

    @keyframes loadingFade {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes dots {
      0% { clip-path: inset(0 100% 0 0); }
      100% { clip-path: inset(0 0 0 0); }
    }

    @keyframes historyEnter {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }


    /* ===== 芯瑤 V2｜明顯動畫強化 ===== */

    html {
      scroll-behavior: smooth;
    }

    body {
      background:
        radial-gradient(circle at 15% 10%, rgba(255, 213, 231, .72), transparent 33%),
        radial-gradient(circle at 85% 24%, rgba(244, 222, 255, .68), transparent 34%),
        radial-gradient(circle at 50% 88%, rgba(255, 228, 239, .70), transparent 38%),
        linear-gradient(135deg, #fff9fc 0%, #fff3f8 45%, #fffafd 100%);
      background-size: 160% 160%;
      animation: animatedBg 13s ease-in-out infinite alternate;
    }

    .page {
      position: relative;
      z-index: 2;
    }

    /* 漂浮愛心與泡泡 */
    .fx-layer {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .fx-heart,
    .fx-bubble {
      position: absolute;
      opacity: .22;
      animation: floatUp linear infinite;
      will-change: transform, opacity;
    }

    .fx-heart::before {
      content: "♡";
      display: block;
      color: #ff8fbb;
      text-shadow: 0 0 16px rgba(255, 132, 181, .38);
      font-weight: 700;
    }

    .fx-bubble {
      border-radius: 999px;
      background: linear-gradient(
        145deg,
        rgba(255,255,255,.92),
        rgba(255,198,223,.33)
      );
      box-shadow:
        inset 0 0 18px rgba(255,255,255,.85),
        0 0 20px rgba(255,144,190,.16);
    }

    /* Hero / Title */
    .hero {
      overflow: hidden;
      animation:
        heroEnter .72s cubic-bezier(.2,.8,.2,1) both,
        cardBreath 5.6s ease-in-out 1.2s infinite;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: -100% -30%;
      background: linear-gradient(
        110deg,
        transparent 35%,
        rgba(255,255,255,.62) 48%,
        transparent 61%
      );
      transform: rotate(8deg);
      animation: heroSweep 6.5s ease-in-out infinite;
      pointer-events: none;
    }

    h1 {
      background: linear-gradient(
        90deg,
        #2d2730 0%,
        #ef4f91 35%,
        #ff8bb6 55%,
        #2d2730 100%
      );
      background-size: 220% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: titleShine 4.5s linear infinite;
    }

    .brand-icon {
      animation:
        logoFloat 3.8s ease-in-out infinite,
        logoGlow 3.8s ease-in-out infinite;
    }

    /* 卡片明顯漂浮 */
    .card {
      animation:
        cardEnter .55s cubic-bezier(.2,.8,.2,1) both,
        cardBreath 6s ease-in-out 1.5s infinite;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background:
        linear-gradient(
          120deg,
          rgba(255,255,255,.7),
          rgba(255,133,181,.20),

      appPage.style.display = "block";
      renderHistory();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function verifyMember() {
      const memberAccount = memberAccountInput.value.trim();

      if (!memberAccount) {
        showLoginMessage("請輸入會員帳號");
        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = "驗證中…";
      loginMessage.style.display = "none";

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "verify",
            memberAccount
          })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(
            data.message ||
            data.error ||
            "會員帳號不存在或尚未開通 AI 使用權限"
          );
        }

        openAnalyzer(memberAccount);
      } catch (error) {
        showLoginMessage(error.message || "登入失敗，請稍後再試");
      } finally {
        loginButton.disabled = false;
        loginButton.textContent = "登入";
      }
    }

    function showLoading(button, text) {
      resultCard.classList.add("show");
      loading.classList.add("show");
      resultContent.style.display = "none";
      resultContent.classList.remove("error");
      resultBadge.textContent = "分析中";
      button.disabled = true;
      button.textContent = text;
      resultCard.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function restoreButtons() {
      submitButton.disabled = false;
      submitButton.textContent = "開始分析";
      continueSubmitButton.disabled = false;
      continueSubmitButton.textContent = "開始續玩分析";
    }

    function burstCelebration() {
      const layer = document.createElement("div");
      layer.className = "celebration";

      const colors = ["#ff83b5", "#ffc0d8", "#f0c8ff", "#ffd8e7", "#ffffff"];

      for (let i = 0; i < 22; i++) {
        const p = document.createElement("span");
        const angle = (Math.PI * 2 * i) / 22 + Math.random() * .25;
        const distance = 70 + Math.random() * 135;
        const x = Math.cos(angle) * distance;
        const y = Math.sin(angle) * distance;

        p.style.setProperty("--x", `${x}px`);
        p.style.setProperty("--y", `${y}px`);
        p.style.setProperty("--r", `${Math.random() * 240 - 120}deg`);
        p.style.setProperty("--particle-color", colors[i % colors.length]);

        if (i % 4 === 0) {
          p.style.borderRadius = "2px";
        }

        layer.appendChild(p);
      }

      document.body.appendChild(layer);
      setTimeout(() => layer.remove(), 950);
    }

    function typeResultText(text) {
      resultContent.classList.add("typing");
      resultContent.textContent = "";

      const chars = Array.from(String(text));
      let index = 0;
      const step = Math.max(6, Math.min(16, 900 / Math.max(chars.length, 1)));

      function typeNext() {
        const chunk = chars.slice(index, index + 3).join("");
        resultContent.textContent += chunk;
        index += 3;

        if (index < chars.length) {
          setTimeout(typeNext, step);
        } else {
          resultContent.classList.remove("typing");
        }
      }

      typeNext();
    }

    function showResult(text) {
      loading.classList.remove("show");
      resultContent.style.display = "block";
      resultContent.classList.remove("error");
      resultBadge.textContent = "分析完成";
      restoreButtons();

      burstCelebration();
      typeResultText(text);
    }

    function showError(message) {
      loading.classList.remove("show");
      resultContent.style.display = "block";
      resultContent.classList.add("error");
      resultContent.textContent = message;
      resultBadge.textContent = "發生錯誤";
      restoreButtons();
    }

    function historyKey() {
      return `xinyao_history_${loggedInMember}`;
    }

    function getHistory() {
      try {
        return JSON.parse(localStorage.getItem(historyKey()) || "[]");
      } catch {
        return [];
      }
    }

    function addHistory(type, game, room, result) {
      const history = getHistory();

      history.unshift({
        type,
        game,
        room,
        result,
        createdAt: new Date().toISOString()
      });

      localStorage.setItem(
        historyKey(),
        JSON.stringify(history.slice(0, 30))
      );

      renderHistory();
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function renderHistory() {
      const history = getHistory();

      if (!history.length) {
        historyList.innerHTML =
          '<div class="history-empty">目前還沒有分析紀錄。</div>';
        return;
      }

      historyList.innerHTML = history.map((item) => {
        const time = new Date(item.createdAt).toLocaleString("zh-TW");
        const summary = item.result.length > 160
          ? `${item.result.slice(0, 160)}…`
          : item.result;

        return `
          <article class="history-item">
            <div class="history-top">
              <span>${escapeHtml(item.type)}｜${escapeHtml(item.game)}｜房號 ${escapeHtml(item.room)}</span>
              <span class="history-time">${escapeHtml(time)}</span>
            </div>
            <div class="history-summary">${escapeHtml(summary)}</div>
          </article>
        `;
      }).join("");
    }

    async function sendAnalysis(payload, button, loadingText, historyType) {
      if (!loggedInMember) {
        loginPage.style.display = "flex";
        appPage.style.display = "none";
        showLoginMessage("登入狀態已失效，請重新輸入會員帳號");
        return;
      }

      showLoading(button, loadingText);

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        let data;

        try {
          data = await response.json();
        } catch {
          throw new Error("伺服器回傳格式錯誤");
        }

        if (!response.ok) {
          const detail =
            data?.detail?.message ||
            data?.detail ||
            data?.error ||
            `請求失敗：${response.status}`;

          throw new Error(
            typeof detail === "string"
              ? detail
              : JSON.stringify(detail)
          );
        }

        if (!data.result) {
          throw new Error("沒有收到分析結果");
        }

        showResult(data.result);
        addHistory(historyType, payload.game, payload.room, data.result);
      } catch (error) {
        console.error(error);
        showError(`分析失敗：${error.message}`);
      }
    }

    analysisForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const payload = {
        action: "analyze",
        memberAccount: loggedInMember,
        game: $("game").value,
        room: $("room").value.trim(),
        score: numberValue("score"),
        unopen: numberValue("unopen"),
        prev1: numberValue("prev1"),
        prev2: numberValue("prev2"),
        capital: numberValue("capital")
      };

      const invalid =
        !payload.game ||
        !payload.room ||
        !Number.isFinite(payload.score) ||
        !Number.isFinite(payload.unopen) ||
        !Number.isFinite(payload.prev1) ||
        !Number.isFinite(payload.prev2) ||
        !Number.isFinite(payload.capital);

      if (invalid) {
        resultCard.classList.add("show");
        showError("資料沒有填完整，請檢查所有欄位。");
        return;
      }

      await sendAnalysis(payload, submitButton, "分析中…", "房號分析");
    });

    continueForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const payload = {
        action: "continue",
        memberAccount: loggedInMember,
        game: $("continueGame").value,
        room: $("continueRoom").value.trim(),
        capital: numberValue("continueCapital"),
        current_balance: numberValue("currentBalance"),
        free_game_count: numberValue("freeGameCount"),
        max_win: numberValue("maxWin"),
        play_duration: $("playDuration").value,
        status: $("continueStatus").value
      };

      const invalid =
        !payload.game ||
        !payload.room ||
        !payload.play_duration ||
        !payload.status ||
        !Number.isFinite(payload.capital) ||
        !Number.isFinite(payload.current_balance) ||
        !Number.isFinite(payload.free_game_count) ||
        !Number.isFinite(payload.max_win);

      if (invalid) {
        resultCard.classList.add("show");
        showError("續玩資料沒有填完整，請檢查所有欄位。");
        return;
      }

      await sendAnalysis(
        payload,
        continueSubmitButton,
        "續玩分析中…",
        "續玩分析"
      );
    });

    $("clearButton").addEventListener("click", () => {
      analysisForm.reset();
      resultCard.classList.remove("show");
    });

    $("continueClearButton").addEventListener("click", () => {
      continueForm.reset();
      resultCard.classList.remove("show");
    });

    $("clearHistoryButton").addEventListener("click", () => {
      if (!confirm("確定要清空自己的分析紀錄嗎？")) {
        return;
      }

      localStorage.removeItem(historyKey());
      renderHistory();
    });

    document.querySelectorAll(".mode-button").forEach((button) => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".mode-button").forEach((item) => {
          item.classList.remove("active");
        });

        document.querySelectorAll(".panel").forEach((panel) => {
          panel.classList.remove("active");
        });

        button.classList.add("active");
        $(button.dataset.panel).classList.add("active");
        resultCard.classList.remove("show");

        if (button.dataset.panel === "historyPanel") {
          renderHistory();
        }

        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });

    loginButton.addEventListener("click", verifyMember);

    memberAccountInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        verifyMember();
      }
    });

    if (loggedInMember) {
      memberAccountInput.value = loggedInMember;
      openAnalyzer(loggedInMember);
    }

    // 停用 Service Worker，避免 GitHub Pages 長期讀到舊版快取。
  </script>
</body>
</html>
