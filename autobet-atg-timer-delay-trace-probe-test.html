<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>芯瑤 ATG Timer Delay Trace Probe 測試</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:30px 16px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif;
  background:#fff6fa;
  color:#59434d;
}

.wrap{
  width:min(900px,100%);
  margin:auto;
}

.card{
  background:#fff;
  border:1px solid #ffd3e3;
  border-radius:20px;
  padding:20px;
  margin-bottom:16px;
}

h1{
  margin-top:0;
  color:#ef377e;
}

.notice{
  padding:12px;
  border-radius:12px;
  background:#fff0f6;
  line-height:1.7;
}

.ok{
  color:#16865b;
  font-weight:900;
  line-height:1.9;
}

.fail{
  color:#d83d58;
  font-weight:900;
  line-height:1.9;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="card">
    <h1>🌸 芯瑤 ATG Timer Delay Trace Probe 測試</h1>

    <div class="notice">
      ⚠️ 目前只測試 setTimeout 延遲紀錄。<br>
      不縮短時間、不加速、不按 Spin、不改下注。
    </div>
  </div>

  <div class="card">
    <h3>🧪 Timer Delay Trace Probe 測試</h3>
    <div id="result">測試中…</div>
  </div>

</div>


<script src="./xinyao_ATG_timer_delay_trace_probe.js"></script>

<script>
(() => {

  const box =
    document.getElementById('result');


  /*
    RED：
    Probe 尚未建立時，
    這裡應該失敗。
  */
  if (
    !window.XinyaoATGTimerDelayTraceProbe
  ) {

    box.innerHTML =
      '<div class="fail">❌ Timer Delay Trace Probe 尚未建立｜這次失敗是正常的</div>';

    return;
  }


  const Probe =
    window.XinyaoATGTimerDelayTraceProbe;


  /* ======================================================
     假 setTimeout
  ====================================================== */

  let nextId = 700;


  const originalSetTimeout =
    function(callback, delay, ...args) {

      const id =
        nextId++;

      if (
        typeof callback === 'function'
      ) {
        callback(...args);
      }

      return id;
    };


  const fakeGlobals = {
    setTimeout:
      originalSetTimeout
  };


  Probe.reset();


  Probe.install({
    globals:
      fakeGlobals
  });


  const tests = [];


  function add(
    name,
    expected,
    actual
  ) {

    tests.push({
      name,
      expected:String(expected),
      actual:String(actual),

      ok:
        String(expected) ===
        String(actual)
    });
  }


  add(
    '安裝狀態',
    true,
    Probe.getState().installed
  );


  /* ======================================================
     建立不同延遲
  ====================================================== */

  const returnValue =
    fakeGlobals.setTimeout(
      () => {},
      0
    );


  fakeGlobals.setTimeout(
    () => {},
    100
  );


  fakeGlobals.setTimeout(
    () => {},
    300
  );


  fakeGlobals.setTimeout(
    () => {},
    300
  );


  fakeGlobals.setTimeout(
    () => {},
    1500
  );


  const snapshot =
    Probe.snapshot();


  add(
    'Timeout 總建立數',
    5,
    snapshot.totalScheduled
  );


  add(
    '0ms 次數',
    1,
    snapshot.delays['0']
  );


  add(
    '100ms 次數',
    1,
    snapshot.delays['100']
  );


  add(
    '300ms 次數',
    2,
    snapshot.delays['300']
  );


  add(
    '1500ms 次數',
    1,
    snapshot.delays['1500']
  );


  add(
    '最小延遲',
    0,
    snapshot.minDelay
  );


  add(
    '最大延遲',
    1500,
    snapshot.maxDelay
  );


  add(
    '平均延遲',
    440,
    snapshot.averageDelay
  );


  add(
    '原本回傳值沒有被破壞',
    700,
    returnValue
  );


  add(
    'Callback 執行數',
    5,
    snapshot.fired
  );


  add(
    'Probe 模式',
    'PASSIVE_TIMER_DELAY_TRACE',
    Probe.getMode()
  );


  add(
    '沒有速度修改功能',
    'undefined',
    typeof Probe.setSpeed
  );


  /* ======================================================
     卸載
  ====================================================== */

  Probe.uninstall();


  add(
    '卸載後狀態',
    false,
    Probe.getState().installed
  );


  add(
    'setTimeout 已恢復原函式',
    true,
    fakeGlobals.setTimeout ===
      originalSetTimeout
  );


  /* ======================================================
     輸出
  ====================================================== */

  let passed = 0;


  const html =
    tests.map(test => {

      if (test.ok) {
        passed++;
      }

      return `
        <div class="${
          test.ok
            ? 'ok'
            : 'fail'
        }">

          ${
            test.ok
              ? '✅'
              : '❌'
          }

          ${test.name}

          ｜預期：
          ${test.expected}

          ｜實際：
          ${test.actual}

        </div>
      `;

    }).join('');


  box.innerHTML =
    html +
    `<hr><b>結果：${passed} / ${tests.length} 通過</b>`;

})();
</script>

</body>
</html>
