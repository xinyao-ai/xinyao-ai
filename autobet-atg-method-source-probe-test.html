<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>芯瑤 ATG Method Source Probe 測試</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:30px 16px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif;
  background:#fff6fa;
  color:#59434d;
}

.wrap{
  width:min(900px,100%);
  margin:auto;
}

.card{
  background:#fff;
  border:1px solid #ffd3e3;
  border-radius:20px;
  padding:20px;
  margin-bottom:16px;
}

h1{
  margin-top:0;
  color:#ef377e;
}

.notice{
  padding:12px;
  border-radius:12px;
  background:#fff0f6;
  line-height:1.7;
}

.ok{
  color:#16865b;
  font-weight:900;
  line-height:1.9;
}

.fail{
  color:#d83d58;
  font-weight:900;
  line-height:1.9;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="card">

    <h1>
      🌸 芯瑤 ATG Method Source Probe 測試
    </h1>

    <div class="notice">
      ⚠️ 只讀函式名稱、參數、Function source。<br>
      不執行 speedUp、不觸發 QuickStop、不按 Spin、不改下注。
    </div>

  </div>

  <div class="card">

    <h3>🧪 Method Source Probe 測試</h3>

    <div id="result">
      測試中…
    </div>

  </div>

</div>


<script src="./xinyao_ATG_method_source_probe.js"></script>

<script>
(() => {

  const box =
    document.getElementById('result');


  if (
    !window.XinyaoATGMethodSourceProbe
  ) {

    box.innerHTML =
      '<div class="fail">❌ Method Source Probe 尚未建立｜這次失敗是正常的</div>';

    return;
  }


  const Probe =
    window.XinyaoATGMethodSourceProbe;


  let dangerousCalls =
    0;


  class FakeSpinButton {

    speedUp(
      multiplier = 2
    ) {

      dangerousCalls++;

      this.reelController?.setSpeed(
        multiplier
      );

      return multiplier;
    }


    setAnimation(
      name,
      loop = false
    ) {

      dangerousCalls++;

      return {
        name,
        loop
      };
    }


    addClickEvent(
      handler
    ) {

      dangerousCalls++;

      this.node?.on(
        'click',
        handler
      );
    }


    playSpineReleasedAnim() {

      dangerousCalls++;

      return 'released';
    }


    update(dt) {

      return dt;
    }

  }


  const target =
    new FakeSpinButton();


  target.__classname__ =
    'SpinButton';


  target.node = {
    name:'QuickStopBtn'
  };


  let getterCalls =
    0;


  Object.defineProperty(
    target,
    'dangerousGetter',
    {
      configurable:true,

      get(){

        getterCalls++;

        return 'NO';
      }
    }
  );


  Probe.reset();


  const result =
    Probe.inspect({

      target,

      methods:[
        'speedUp',
        'setAnimation',
        'addClickEvent',
        'playSpineReleasedAnim'
      ]

    });


  const tests =
    [];


  function add(
    name,
    expected,
    actual
  ) {

    tests.push({

      name,

      expected:
        String(expected),

      actual:
        String(actual),

      ok:
        String(expected) ===
        String(actual)

    });
  }


  function method(
    name
  ) {

    return result.methods.find(
      item =>
        item.name === name
    );
  }


  add(
    '成功分析',
    true,
    result.found
  );


  add(
    'Component 名稱',
    'SpinButton',
    result.componentName
  );


  add(
    'Node 名稱',
    'QuickStopBtn',
    result.nodeName
  );


  add(
    '找到 speedUp',
    true,
    !!method(
      'speedUp'
    )
  );


  add(
    'speedUp 參數含 multiplier',
    true,
    method(
      'speedUp'
    )
      ?.parameters
      ?.includes(
        'multiplier'
      )
  );


  add(
    'speedUp source 含 setSpeed',
    true,
    method(
      'speedUp'
    )
      ?.source
      ?.includes(
        'setSpeed'
      )
  );


  add(
    '找到 setAnimation',
    true,
    !!method(
      'setAnimation'
    )
  );


  add(
    'setAnimation 參數含 name',
    true,
    method(
      'setAnimation'
    )
      ?.parameters
      ?.includes(
        'name'
      )
  );


  add(
    'setAnimation 參數含 loop',
    true,
    method(
      'setAnimation'
    )
      ?.parameters
      ?.includes(
        'loop'
      )
  );


  add(
    '找到 addClickEvent',
    true,
    !!method(
      'addClickEvent'
    )
  );


  add(
    'addClickEvent source 含 click',
    true,
    method(
      'addClickEvent'
    )
      ?.source
      ?.toLowerCase()
      ?.includes(
        'click'
      )
  );


  add(
    '找到 playSpineReleasedAnim',
    true,
    !!method(
      'playSpineReleasedAnim'
    )
  );


  add(
    '沒有執行任何方法',
    0,
    dangerousCalls
  );


  add(
    '沒有執行 Getter',
    0,
    getterCalls
  );


  add(
    'Probe 模式',
    'PASSIVE_METHOD_SOURCE_PROBE',
    Probe.getMode()
  );


  add(
    '沒有 invoke',
    'undefined',
    typeof Probe.invoke
  );


  add(
    '沒有 speedUp',
    'undefined',
    typeof Probe.speedUp
  );


  add(
    '沒有 quickStop',
    'undefined',
    typeof Probe.quickStop
  );


  Probe.reset();


  add(
    'Reset 後 found',
    false,
    Probe.getLastResult().found
  );


  let passed =
    0;


  const html =
    tests.map(test => {

      if (test.ok) {
        passed++;
      }


      return `
        <div class="${
          test.ok
            ? 'ok'
            : 'fail'
        }">

          ${
            test.ok
              ? '✅'
              : '❌'
          }

          ${test.name}

          ｜預期：
          ${test.expected}

          ｜實際：
          ${test.actual}

        </div>
      `;

    }).join('');


  box.innerHTML =
    html +
    `<hr><b>結果：${passed} / ${tests.length} 通過</b>`;

})();
</script>

</body>
</html>
