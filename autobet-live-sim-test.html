<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>芯瑤 AutoBet Live Sim 測試</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:30px 16px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif;
  background:#fff6fa;
  color:#59434d;
}

.wrap{
  width:min(820px,100%);
  margin:auto;
}

.card{
  background:#fff;
  border:1px solid #ffd3e3;
  border-radius:20px;
  padding:20px;
  margin-bottom:16px;
}

h1{
  margin-top:0;
  color:#ef377e;
}

.notice{
  padding:12px;
  border-radius:12px;
  background:#fff0f6;
  line-height:1.7;
}

.ok{
  color:#16865b;
  font-weight:900;
  line-height:1.9;
}

.fail{
  color:#d83d58;
  font-weight:900;
  line-height:1.9;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="card">
    <h1>🌸 芯瑤 AutoBet Live Simulator 測試</h1>

    <div class="notice">
      ⚠️ 測試「自動逐局模擬、暫停、繼續、停止」。<br>
      仍然不會按 ATG Spin、不會改注、不會碰正式程式。
    </div>
  </div>

  <div class="card">
    <h3>🧪 Live Simulator 測試</h3>
    <div id="result">測試中…</div>
  </div>

</div>

<script src="./xinyao_ATG_autobet_engine.js"></script>
<script src="./xinyao_ATG_autobet_strategy.js"></script>
<script src="./xinyao_ATG_autobet_controller.js"></script>
<script src="./xinyao_ATG_autobet_runner.js"></script>
<script src="./xinyao_ATG_autobet_session.js"></script>
<script src="./xinyao_ATG_autobet_simulator.js"></script>

<script src="./xinyao_ATG_autobet_live_sim.js"></script>

<script>
(() => {

  const box =
    document.getElementById('result');

  if (!window.XinyaoAutoBetLiveSim) {

    box.innerHTML =
      '<div class="fail">❌ Live Simulator 尚未建立｜這次失敗是正常的</div>';

    return;
  }

  const S =
    window.XinyaoAutoBetSession;

  const L =
    window.XinyaoAutoBetLiveSim;

  const tests = [];

  function add(name, expected, actual) {

    tests.push({
      name,
      expected: String(expected),
      actual: String(actual),
      ok:
        String(expected) ===
        String(actual)
    });

  }

  S.reset({
    startBalance: 2000,
    balance: 2000,
    takeProfit: 1000,
    stopLoss: 800,
    maxSpins: 100
  });

  L.reset();

  L.configure({
    balances: [
      1996,
      2004,
      1992
    ]
  });

  add(
    '初始狀態',
    'STOPPED',
    L.getState().status
  );

  L.start();

  add(
    '開始',
    'RUNNING',
    L.getState().status
  );

  L.tickOnce();

  add(
    '第 1 局完成',
    1,
    S.getState().totalSpins
  );

  add(
    '第 1 局點數',
    1996,
    S.getState().balance
  );

  L.pause();

  add(
    '暫停',
    'PAUSED',
    L.getState().status
  );

  const before =
    S.getState().totalSpins;

  L.tickOnce();

  add(
    '暫停時不執行',
    before,
    S.getState().totalSpins
  );

  L.resume();

  add(
    '繼續',
    'RUNNING',
    L.getState().status
  );

  L.tickOnce();

  add(
    '第 2 局完成',
    2,
    S.getState().totalSpins
  );

  add(
    '第 2 局點數',
    2004,
    S.getState().balance
  );

  L.stop();

  add(
    '停止',
    'STOPPED',
    L.getState().status
  );

  let passed = 0;

  const html =
    tests.map(test => {

      if (test.ok) {
        passed++;
      }

      return `
        <div class="${test.ok ? 'ok' : 'fail'}">
          ${test.ok ? '✅' : '❌'}
          ${test.name}
          ｜預期：${test.expected}
          ｜實際：${test.actual}
        </div>
      `;

    }).join('');

  box.innerHTML =
    html +
    `<hr><b>結果：${passed} / ${tests.length} 通過</b>`;

})();
</script>

</body>
</html>
