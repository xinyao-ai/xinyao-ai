<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>芯瑤 AutoBet Console 測試</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:30px 16px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif;
  background:#fff6fa;
  color:#59434d;
}

.wrap{
  width:min(780px,100%);
  margin:auto;
}

.card{
  background:#fff;
  border:1px solid #ffd3e3;
  border-radius:20px;
  padding:20px;
  margin-bottom:16px;
}

h1{
  margin-top:0;
  color:#ef377e;
}

.notice{
  padding:12px;
  border-radius:12px;
  background:#fff0f6;
  line-height:1.7;
}

.ok{
  color:#16865b;
  font-weight:900;
  line-height:1.9;
}

.fail{
  color:#d83d58;
  font-weight:900;
  line-height:1.9;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="card">

    <h1>🌸 芯瑤 AutoBet Console 測試</h1>

    <div class="notice">
      ⚠️ 目前只測試控制台狀態。<br>
      不會按 Spin、不會改注、不會操作 ATG。
    </div>

  </div>

  <div class="card">

    <h3>🧪 Console 測試</h3>

    <div id="result">
      測試中…
    </div>

  </div>

</div>

<script src="./xinyao_ATG_autobet_console.js"></script>

<script>
(() => {

  const box =
    document.getElementById('result');

  if (!window.XinyaoAutoBetConsole) {

    box.innerHTML =
      '<div class="fail">❌ Console 尚未建立｜這次失敗是正常的</div>';

    return;
  }

  const C =
    window.XinyaoAutoBetConsole;

  const tests = [];

  function addTest(
    name,
    expected,
    actual
  ) {

    tests.push({
      name,
      expected,
      actual,
      ok: expected === actual
    });

  }

  /*
    建立新控制台
  */
  C.reset();

  addTest(
    '初始狀態',
    'STOPPED',
    C.getState().status
  );

  /*
    開始
  */
  C.start();

  addTest(
    '開始模擬',
    'RUNNING',
    C.getState().status
  );

  /*
    暫停
  */
  C.pause();

  addTest(
    '暫停',
    'PAUSED',
    C.getState().status
  );

  /*
    繼續
  */
  C.resume();

  addTest(
    '繼續',
    'RUNNING',
    C.getState().status
  );

  /*
    緊急停止
  */
  C.emergencyStop();

  addTest(
    '緊急停止',
    'STOPPED',
    C.getState().status
  );

  addTest(
    '緊急停止原因',
    'EMERGENCY_STOP',
    C.getState().reason
  );

  let passed = 0;

  const html =
    tests.map(test => {

      if (test.ok) {
        passed++;
      }

      return `
        <div class="${test.ok ? 'ok' : 'fail'}">

          ${test.ok ? '✅' : '❌'}

          ${test.name}

          ｜預期：
          ${test.expected}

          ｜實際：
          ${test.actual}

        </div>
      `;

    }).join('');

  box.innerHTML =
    html +
    `<hr><b>結果：${passed} / ${tests.length} 通過</b>`;

})();
</script>

</body>
</html>
