name: Build Seth Oracle Windows APP
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - main.js
      - package.json
      - package-lock.json
      - .github/workflows/seth-oracle-windows.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Windows installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SethOracle-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
