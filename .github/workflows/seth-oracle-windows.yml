name: Build Seth Oracle Windows APP
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - main.js
      - package.json
      - package-lock.json
      - .github/workflows/seth-oracle-windows.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Windows installer
        run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SethOracle-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Prepare stable installer filename
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter '*.exe' | Where-Object { $_.Name -notlike '*uninstaller*' } | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer not found' }
          Copy-Item -LiteralPath $installer.FullName -Destination 'dist/SethOracle-Windows-Setup.exe' -Force
      - name: Publish stable Windows download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-stable
          name: Seth Oracle Windows Stable
          make_latest: false
          files: dist/SethOracle-Windows-Setup.exe
          overwrite_files: true
          fail_on_unmatched_files: true
