name: Prepare transparent Tiger Girl thumbnail
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/transparent-tiger-thumb.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Remove connected light background
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image
          from collections import deque
          src='assets/tiger-girl.jpg'
          dst='assets/tiger-girl-transparent.png'
          image=Image.open(src).convert('RGBA')
          w,h=image.size
          px=image.load()
          def white(r,g,b):
              return min(r,g,b) >= 183 and max(r,g,b)-min(r,g,b) <= 52
          q=deque()
          seen=bytearray(w*h)
          for x in range(w):
              for y in (0,h-1):
                  if white(*px[x,y][:3]):
                      i=y*w+x
                      if not seen[i]: seen[i]=1;q.append((x,y))
          for y in range(h):
              for x in (0,w-1):
                  if white(*px[x,y][:3]):
                      i=y*w+x
                      if not seen[i]: seen[i]=1;q.append((x,y))
          count=0
          while q:
              x,y=q.popleft()
              r,g,b,a=px[x,y]
              # Smooth edge: bright neutral pixels become transparent
              strength=min(1,max(0,(min(r,g,b)-178)/58))
              px[x,y]=(r,g,b,int(255*(1-strength))) 
              count+=1
              for nx,ny in ((x-1,y),(x+1,y),(x,y-1),(x,y+1)):
                  if 0<=nx<w and 0<=ny<h:
                      i=ny*w+nx
                      if not seen[i] and white(*px[nx,ny][:3]):
                          seen[i]=1
                          q.append((nx,ny))
          print(f'image: {w}x{h}, connected background pixels: {count} / {w*h}')
          image.save(dst,optimize=True)
          PY
      - name: Commit transparent image
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/tiger-girl-transparent.png
          git diff --cached --quiet && exit 0
          git commit -m "Add transparent Tiger Girl thumbnail"
          git push
