
name: SethOracle iOS Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find iOS Project
        run: |
          find . -name "*.xcodeproj" -print

      - name: Build iOS Device (unsigned)
        run: |
          xcodebuild \
            -project ios/SethOracle.xcodeproj \
            -scheme SethOracle \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned iOS device build
        if: success()
        run: |
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Debug-iphoneos/SethOracle.app' -type d -print -quit)
          test -n "$APP"
          mkdir -p output
          ditto -c -k --sequesterRsrc --keepParent "$APP" output/SethOracle-unsigned-device-app.zip
          mkdir -p output/Payload
          ditto "$APP" output/Payload/SethOracle.app
          (cd output && zip -qry SethOracle-AltStore-unsigned.ipa Payload)
          rm -rf output/Payload

      - name: Upload unsigned device build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SethOracle-unsigned-iPhone-build
          path: output/SethOracle-unsigned-device-app.zip
          retention-days: 7
          if-no-files-found: error

      - name: Upload AltStore IPA (unsigned, must be signed by AltStore)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SethOracle-AltStore-IPA
          path: output/SethOracle-AltStore-unsigned.ipa
          retention-days: 7
          if-no-files-found: error
