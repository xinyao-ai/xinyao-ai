
name: SethOracle iOS Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find iOS Project
        run: |
          find . -name "*.xcodeproj" -print

      - name: Build iOS Simulator
        run: |
          xcodebuild \
            -project ios/SethOracle.xcodeproj \
            -scheme SethOracle \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
