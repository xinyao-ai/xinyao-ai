<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>芯瑤 ATG RAF Source Delta Probe 測試</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:30px 16px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif;
  background:#fff6fa;
  color:#59434d;
}

.wrap{
  width:min(900px,100%);
  margin:auto;
}

.card{
  background:#fff;
  border:1px solid #ffd3e3;
  border-radius:20px;
  padding:20px;
  margin-bottom:16px;
}

h1{
  margin-top:0;
  color:#ef377e;
}

.notice{
  padding:12px;
  border-radius:12px;
  background:#fff0f6;
  line-height:1.7;
}

.ok{
  color:#16865b;
  font-weight:900;
  line-height:1.9;
}

.fail{
  color:#d83d58;
  font-weight:900;
  line-height:1.9;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="card">

    <h1>
      🌸 芯瑤 ATG RAF Source / Delta Probe 測試
    </h1>

    <div class="notice">
      ⚠️ 目前只測 requestAnimationFrame 的來源、呼叫次數與幀時間差。<br>
      不修改 timestamp、不加速、不按 Spin、不改下注。
    </div>

  </div>

  <div class="card">

    <h3>🧪 RAF Source / Delta Probe 測試</h3>

    <div id="result">
      測試中…
    </div>

  </div>

</div>


<script src="./xinyao_ATG_raf_source_delta_probe.js"></script>

<script>
(() => {

  const box =
    document.getElementById(
      'result'
    );


  /*
    RED：
    Probe 尚未建立時，
    這裡就是正確失敗。
  */
  if (
    !window.XinyaoATGRAFSourceDeltaProbe
  ) {

    box.innerHTML =
      '<div class="fail">❌ RAF Source / Delta Probe 尚未建立｜這次失敗是正常的</div>';

    return;
  }


  const Probe =
    window.XinyaoATGRAFSourceDeltaProbe;


  /* ======================================================
     Fake RAF
  ====================================================== */

  let nextId = 500;

  const queued =
    new Map();


  const originalRAF =
    function(callback) {

      const id =
        nextId++;

      queued.set(
        id,
        callback
      );

      return id;
    };


  const fakeGlobals = {

    requestAnimationFrame:
      originalRAF

  };


  function fire(
    id,
    timestamp
  ) {

    const callback =
      queued.get(id);

    if (!callback) {
      return;
    }

    queued.delete(id);

    callback(timestamp);
  }


  /*
    固定假的來源 stack，
    讓測試結果不受瀏覽器影響。
  */
  const fakeStackProvider =
    () => `
Error
    at wrappedRAF (xinyao_ATG_raf_source_delta_probe.js:100:10)
    at spinLoop (https://cdn.example.com/game.bundle.js:123:45)
    at Game.update (https://cdn.example.com/game.bundle.js:200:20)
  `;


  /* ======================================================
     安裝
  ====================================================== */

  Probe.reset();

  Probe.install({

    globals:
      fakeGlobals,

    stackProvider:
      fakeStackProvider

  });


  const tests = [];


  function add(
    name,
    expected,
    actual
  ) {

    tests.push({

      name,

      expected:
        String(expected),

      actual:
        String(actual),

      ok:
        String(expected) ===
        String(actual)

    });
  }


  add(
    '安裝狀態',
    true,
    Probe.getState().installed
  );


  /* ======================================================
     排程三個 RAF
  ====================================================== */

  const receivedTimestamps =
    [];


  const id1 =
    fakeGlobals
      .requestAnimationFrame(
        timestamp => {

          receivedTimestamps.push(
            timestamp
          );
        }
      );


  const id2 =
    fakeGlobals
      .requestAnimationFrame(
        timestamp => {

          receivedTimestamps.push(
            timestamp
          );
        }
      );


  const id3 =
    fakeGlobals
      .requestAnimationFrame(
        timestamp => {

          receivedTimestamps.push(
            timestamp
          );
        }
      );


  add(
    'RAF 排程數',
    3,
    Probe.snapshot().scheduled
  );


  add(
    '原本 RAF 回傳值沒有被破壞',
    500,
    id1
  );


  /* ======================================================
     模擬 60 FPS

     100.0
     116.7
     133.4

     Delta 約 16.7ms
  ====================================================== */

  fire(
    id1,
    100.0
  );

  fire(
    id2,
    116.7
  );

  fire(
    id3,
    133.4
  );


  const snapshot =
    Probe.snapshot();


  add(
    'RAF 執行數',
    3,
    snapshot.fired
  );


  add(
    'Callback timestamp 沒有被修改',
    '100,116.7,133.4',
    receivedTimestamps.join(',')
  );


  add(
    'Delta 樣本數',
    2,
    snapshot.deltaCount
  );


  add(
    '最小 Delta',
    16.7,
    snapshot.minDelta
  );


  add(
    '最大 Delta',
    16.7,
    snapshot.maxDelta
  );


  add(
    '平均 Delta',
    16.7,
    snapshot.averageDelta
  );


  add(
    '最後 Delta',
    16.7,
    snapshot.lastDelta
  );


  /* ======================================================
     RAF Source
  ====================================================== */

  add(
    '抓到 game.bundle.js 來源',
    3,
    snapshot.sources[
      'https://cdn.example.com/game.bundle.js'
    ]
  );


  /* ======================================================
     模式 / 安全
  ====================================================== */

  add(
    'Probe 模式',
    'PASSIVE_RAF_SOURCE_DELTA',
    Probe.getMode()
  );


  add(
    '沒有速度修改功能',
    'undefined',
    typeof Probe.setSpeed
  );


  add(
    '沒有 Spin 功能',
    'undefined',
    typeof Probe.spin
  );


  /* ======================================================
     卸載
  ====================================================== */

  Probe.uninstall();


  add(
    '卸載後狀態',
    false,
    Probe.getState().installed
  );


  add(
    'RAF 已恢復原函式',
    true,
    fakeGlobals.requestAnimationFrame ===
      originalRAF
  );


  /* ======================================================
     輸出
  ====================================================== */

  let passed = 0;


  const html =
    tests.map(test => {

      if (test.ok) {
        passed++;
      }

      return `
        <div class="${
          test.ok
            ? 'ok'
            : 'fail'
        }">

          ${
            test.ok
              ? '✅'
              : '❌'
          }

          ${test.name}

          ｜預期：
          ${test.expected}

          ｜實際：
          ${test.actual}

        </div>
      `;

    }).join('');


  box.innerHTML =
    html +
    `<hr><b>結果：${passed} / ${tests.length} 通過</b>`;

})();
</script>

</body>
</html>
