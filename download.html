<script>
(function(){
const IOS_GUIDE_STEPS = [
    {
      stepNumber: 1,
      title: '先確認：皇鼎娛樂城與賽特神諭使用同一個 Safari',
      bodyHtml: `
        <p>請先確認 <b>HD 皇鼎娛樂城</b> 與 <b>賽特神諭</b> 都使用 <b>同一個 Safari 瀏覽器</b> 開啟。</p>
        <p>不要一個用 Safari、另一個用其他瀏覽器，否則後面的安裝、配對與同步可能無法正常運作。</p>
      `,
      images: [
        './ios_step1.png?v=204'
      ]
    },
    {
      stepNumber: 2,
      title: '到 App Store 安裝 Userscripts',
      bodyHtml: `
        <p>點下方按鈕可直接前往 App Store 的 <b>Userscripts</b> 安裝頁，不需要自己搜尋。</p>
        <p>進入 App Store 後，點擊 <b>【取得】／下載圖示</b> 完成安裝。</p>
      `,
      images: [
        './ios_step2.png?v=204'
      ],
      openUserscriptsAppStore: true
    },
    {
      stepNumber: 3,
      title: '開啟 Userscripts 的 Safari 延伸功能權限',
      bodyHtml: `
        <p>到 iPhone 的 <b>【設定】→【App】→【Safari】→【延伸功能】→【Userscripts】</b>。</p>
        <p>進去後請打開 <b>【允許延伸功能】</b> 與 <b>【在「私密瀏覽」中允許】</b>。</p>
        <p>如果下方有網站權限，也請確認相關網站設定為 <b>允許</b>。</p>
      `,
      images: [
        './ios_step3.png?v=204'
      ]
    },
    {
      stepNumber: 4,
      title: '用 Userscripts 安裝賽特神諭摩斯密碼',
      bodyHtml: `
        <p>先點擊下方 <b>【安裝賽特神諭摩斯密碼】</b>，開啟安裝頁。</p>
        <p>在 Safari 開啟腳本後，點擊網址列的 <b>【拼圖／延伸功能】→【Userscripts】→【Tap to install】→【Install】</b>。</p>
        <p>看到綠色 <b>【Userscript Installed】</b>，再開啟右上角的腳本開關；完成後返回教學，點擊 <b>【下一步】</b>。</p>
      `,
      images: [
        './ios_step5_1.png?v=204',
        './ios_step5_2.png?v=204'
      ],
      openSharedScript: true
    },
    {
      stepNumber: 5,
      title: 'ATG頁面重新整理',
      bodyHtml: `
        <p>回到 <b>【ATG頁面】</b>，點擊 <b>【重新整理】</b> 將立即顯示所有功能，預祝各位玩家遊玩愉快。</p>
      `,
      images: []
    }
  ];
let ix=0;
const modal=document.getElementById('iosGuideModal');
const content=document.getElementById('iosGuideContent');
const count=document.getElementById('iosGuideCount');
const fill=document.getElementById('iosGuideFill');
const prev=document.getElementById('iosGuidePrev');
const next=document.getElementById('iosGuideNext');
function render(){
 const s=IOS_GUIDE_STEPS[ix];
 count.textContent='步驟 '+(ix+1)+' / '+IOS_GUIDE_STEPS.length;
 fill.style.width=((ix+1)*100/IOS_GUIDE_STEPS.length)+'%';
 const imgs=(ix===0?['./assets/ios_step1_safari.png?v=5061']:s.images).map(src=>'<img loading="lazy" src="'+src+'" alt="步驟 '+(ix+1)+' 教學圖片">').join('');
 const links=(s.openUserscriptsAppStore?'<a class="ios-guide-action" href="https://apps.apple.com/tw/app/userscripts/id1463298887" onclick="window.location.href=this.href;return false;">前往 App Store 安裝 Userscripts</a>':'')+(s.openSharedScript?'<a class="ios-guide-action" href="./xinyao_ATG_live.user.js?v=158" target="_blank" rel="noopener noreferrer">安裝賽特神諭摩斯密碼</a>':'');
 content.innerHTML='<h3>'+s.stepNumber+'. '+s.title+'</h3>'+s.bodyHtml+links+imgs;
 prev.disabled=ix===0;next.textContent=ix===IOS_GUIDE_STEPS.length-1?'完成':'下一步 →';next.onclick=ix===IOS_GUIDE_STEPS.length-1?function(){window.location.replace(window.location.pathname+window.location.search+'#downloadTop');}:function(){ix++;render();};
}
document.getElementById('iosGuideOpen').addEventListener('click',function(){ix=0;render();});
function close(){window.location.replace(window.location.pathname+window.location.search+'#downloadTop');}

prev.addEventListener('click',function(){if(ix>0){ix--;render();}});

modal.addEventListener('click',function(e){if(e.target===modal)close();});
document.addEventListener('keydown',function(e){if(location.hash==='#iosGuideModal'&&e.key==='Escape')close();});
window.addEventListener('hashchange',function(){if(location.hash==='#iosGuideModal'){ix=0;render();}});
render();
})();
</script></body></html>
