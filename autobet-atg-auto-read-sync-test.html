<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>芯瑤 ATG Auto Read Sync 測試</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:30px 16px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif;
  background:#fff6fa;
  color:#59434d;
}

.wrap{
  width:min(860px,100%);
  margin:auto;
}

.card{
  background:#fff;
  border:1px solid #ffd3e3;
  border-radius:20px;
  padding:20px;
  margin-bottom:16px;
}

h1{
  margin-top:0;
  color:#ef377e;
}

.notice{
  padding:12px;
  border-radius:12px;
  background:#fff0f6;
  line-height:1.7;
}

.ok{
  color:#16865b;
  font-weight:900;
  line-height:1.9;
}

.fail{
  color:#d83d58;
  font-weight:900;
  line-height:1.9;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="card">
    <h1>🌸 芯瑤 ATG Auto Read Sync 測試</h1>

    <div class="notice">
      ⚠️ 測試「自動定時唯讀同步、暫停、恢復、停止」。<br>
      不按 Spin、不改下注、不操作真正 ATG。
    </div>
  </div>

  <div class="card">
    <h3>🧪 Auto Read Sync 測試</h3>
    <div id="result">測試中…</div>
  </div>

  <div class="card">
    <h3>🎮 即時面板</h3>
    <div id="xinyao-autobet-panel"></div>
  </div>

</div>

<script src="./xinyao_ATG_autobet_engine.js"></script>
<script src="./xinyao_ATG_autobet_strategy.js"></script>
<script src="./xinyao_ATG_autobet_controller.js"></script>
<script src="./xinyao_ATG_autobet_runner.js"></script>
<script src="./xinyao_ATG_autobet_console.js"></script>
<script src="./xinyao_ATG_autobet_session.js"></script>

<script src="./xinyao_ATG_autobet_atg_source_bridge.js"></script>
<script src="./xinyao_ATG_autobet_atg_adapter.js"></script>
<script src="./xinyao_ATG_autobet_atg_read_pipeline.js"></script>
<script src="./xinyao_ATG_autobet_atg_session_sync.js"></script>

<script src="./xinyao_ATG_autobet_panel.js?v=0201"></script>
<script src="./xinyao_ATG_autobet_atg_read_panel.js"></script>

<script src="./xinyao_ATG_autobet_atg_auto_read_sync.js"></script>

<script>
(async () => {

  const box =
    document.getElementById('result');

  if (!window.XinyaoATGAutoReadSync) {

    box.innerHTML =
      '<div class="fail">❌ Auto Read Sync 尚未建立｜這次失敗是正常的</div>';

    return;
  }

  const B =
    window.XinyaoATGSourceBridge;

  const P =
    window.XinyaoATGReadPipeline;

  const S =
    window.XinyaoAutoBetSession;

  const Y =
    window.XinyaoATGReadSessionSync;

  const RP =
    window.XinyaoATGReadPanel;

  const A =
    window.XinyaoATGAutoReadSync;

  const wait = ms =>
    new Promise(resolve =>
      setTimeout(resolve, ms)
    );

  let source = {
    balance:'1000.90',
    bet:'4',
    roomId:'0863',
    freeGameActive:false,
    spinCompleted:false
  };

  B.configure({
    sourceReader:() => source
  });

  P.connect();

  S.reset({
    startBalance:1000.90,
    balance:1000.90,
    takeProfit:500,
    stopLoss:400,
    maxSpins:100
  });

  Y.reset();
  Y.connect();

  RP.mount(
    '#xinyao-autobet-panel'
  );

  A.reset();

  const tests = [];

  function add(name,expected,actual) {

    tests.push({
      name,
      expected:String(expected),
      actual:String(actual),
      ok:String(expected) === String(actual)
    });

  }

  add(
    '初始狀態',
    'STOPPED',
    A.getState().status
  );

  A.start({
    intervalMs:80
  });

  add(
    '開始同步',
    'RUNNING',
    A.getState().status
  );

  await wait(130);

  add(
    '第一次自動讀取點數',
    1000.9,
    S.getState().balance
  );

  /*
    模擬一局完成
  */
  source = {
    balance:'996.90',
    bet:'4',
    roomId:'0863',
    freeGameActive:false,
    spinCompleted:true
  };

  await wait(130);

  add(
    '自動同步第一局點數',
    996.9,
    S.getState().balance
  );

  add(
    '自動記錄第一局',
    1,
    S.getState().totalSpins
  );

  /*
    暫停
  */
  A.pause();

  add(
    '暫停狀態',
    'PAUSED',
    A.getState().status
  );

  source = {
    balance:'992.90',
    bet:'4',
    roomId:'0863',
    freeGameActive:false,
    spinCompleted:false
  };

  await wait(180);

  add(
    '暫停時不更新點數',
    996.9,
    S.getState().balance
  );

  /*
    恢復後先讓 false 被讀到
  */
  A.resume();

  await wait(130);

  add(
    '恢復狀態',
    'RUNNING',
    A.getState().status
  );

  add(
    '恢復後點數更新',
    992.9,
    S.getState().balance
  );

  add(
    'false 不增加新局',
    1,
    S.getState().totalSpins
  );

  /*
    第二局完成
  */
  source = {
    balance:'988.90',
    bet:'4',
    roomId:'0863',
    freeGameActive:false,
    spinCompleted:true
  };

  await wait(130);

  add(
    '第二局自動記錄',
    2,
    S.getState().totalSpins
  );

  add(
    '第二局點數',
    988.9,
    S.getState().balance
  );

  /*
    停止後不應再更新
  */
  A.stop();

  add(
    '停止狀態',
    'STOPPED',
    A.getState().status
  );

  source = {
    balance:'984.90',
    bet:'4',
    roomId:'0863',
    freeGameActive:false,
    spinCompleted:false
  };

  await wait(180);

  add(
    '停止後不再更新',
    988.9,
    S.getState().balance
  );

  let passed = 0;

  const html =
    tests.map(test => {

      if (test.ok) {
        passed++;
      }

      return `
        <div class="${test.ok ? 'ok' : 'fail'}">
          ${test.ok ? '✅' : '❌'}
          ${test.name}
          ｜預期：${test.expected}
          ｜實際：${test.actual}
        </div>
      `;

    }).join('');

  box.innerHTML =
    html +
    `<hr><b>結果：${passed} / ${tests.length} 通過</b>`;

})();
</script>

</body>
</html>
