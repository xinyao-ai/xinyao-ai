<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>芯瑤 ATG Speed Probe 測試</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:30px 16px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif;
  background:#fff6fa;
  color:#59434d;
}

.wrap{
  width:min(900px,100%);
  margin:auto;
}

.card{
  background:#fff;
  border:1px solid #ffd3e3;
  border-radius:20px;
  padding:20px;
  margin-bottom:16px;
}

h1{
  margin-top:0;
  color:#ef377e;
}

.notice{
  background:#fff0f6;
  padding:12px;
  border-radius:12px;
  line-height:1.7;
}

.ok{
  color:#16865b;
  font-weight:900;
  line-height:1.9;
}

.fail{
  color:#d83d58;
  font-weight:900;
  line-height:1.9;
}

#fixture{
  display:none;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="card">

    <h1>
      🌸 芯瑤 ATG Speed Probe 測試
    </h1>

    <div class="notice">
      ⚠️ 目前只偵測動畫環境。<br>
      不加速、不按 Spin、不改下注、不跳免遊。
    </div>

  </div>

  <div class="card">

    <h3>🧪 Speed Probe 測試</h3>

    <div id="result">
      測試中…
    </div>

  </div>

</div>


<div id="fixture">

  <canvas
    id="game-canvas"
    width="800"
    height="600"
  ></canvas>

  <div
    id="animated"
    style="
      animation:
        xinyao-test-animation
        2s
        linear
        infinite;
    "
  ></div>

</div>


<style>
@keyframes xinyao-test-animation {
  from { opacity:.9; }
  to   { opacity:1; }
}
</style>


<script src="./xinyao_ATG_speed_probe.js"></script>

<script>
(() => {

  const box =
    document.getElementById(
      'result'
    );

  if (
    !window.XinyaoATGSpeedProbe
  ) {

    box.innerHTML =
      '<div class="fail">❌ Speed Probe 尚未建立｜這次失敗是正常的</div>';

    return;
  }


  const fakeGlobals = {

    requestAnimationFrame:
      () => {},

    setTimeout:
      () => {},

    setInterval:
      () => {},

    PIXI: {
      VERSION:'test'
    }
  };


  const result =
    window
      .XinyaoATGSpeedProbe
      .analyze({

        root:
          document.getElementById(
            'fixture'
          ),

        globals:
          fakeGlobals

      });


  const tests = [];


  function add(
    name,
    expected,
    actual
  ) {

    tests.push({

      name,

      expected:
        String(expected),

      actual:
        String(actual),

      ok:
        String(expected) ===
        String(actual)

    });

  }


  add(
    '偵測到 Canvas',
    true,
    result.canvasCount > 0
  );


  add(
    '偵測到 RAF API',
    true,
    result.hasRAF
  );


  add(
    '偵測到 setTimeout',
    true,
    result.hasTimeout
  );


  add(
    '偵測到 setInterval',
    true,
    result.hasInterval
  );


  add(
    '偵測到 PIXI',
    true,
    result.engineHints.includes(
      'PIXI'
    )
  );


  add(
    'Speed Probe 模式',
    'PASSIVE_SPEED_PROBE',
    result.mode
  );


  add(
    '沒有 Spin 控制',
    'undefined',
    typeof window
      .XinyaoATGSpeedProbe
      .spin
  );


  add(
    '沒有下注控制',
    'undefined',
    typeof window
      .XinyaoATGSpeedProbe
      .setBet
  );


  add(
    '沒有速度修改功能',
    'undefined',
    typeof window
      .XinyaoATGSpeedProbe
      .setSpeed
  );


  let passed = 0;


  const html =
    tests.map(test => {

      if (test.ok) {
        passed++;
      }

      return `
        <div class="${
          test.ok
            ? 'ok'
            : 'fail'
        }">

          ${
            test.ok
              ? '✅'
              : '❌'
          }

          ${test.name}

          ｜預期：
          ${test.expected}

          ｜實際：
          ${test.actual}

        </div>
      `;

    }).join('');


  box.innerHTML =
    html +
    `<hr><b>結果：${passed} / ${tests.length} 通過</b>`;

})();
</script>

</body>
</html>
